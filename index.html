<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Layout: audio-first, keyboard-first single column. Levels > modules > learn / story / practice. Large type and strong contrast for low vision. */
:root{
  --navy:#14214a; --gold:#f2b705; --bg:#ffffff; --card:#f3f5fb; --fg:#0b1230; --muted:#38415f; --line:#14214a;
  --good:#0b6b3a; --bad:#a3200b; --focus:#f2b705; --lock:#6b7290;
  --font:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0a1230; --gold:#ffd23f; --bg:#05081a; --card:#121a3c; --fg:#ffffff; --muted:#dfe4ff; --line:#ffd23f;
  --good:#6ee7a8; --bad:#ff8f7a; --focus:#ffd23f; --lock:#9aa3c7; color-scheme:dark }}
:root[data-theme="dark"]{
  --navy:#0a1230; --gold:#ffd23f; --bg:#05081a; --card:#121a3c; --fg:#ffffff; --muted:#dfe4ff; --line:#ffd23f;
  --good:#6ee7a8; --bad:#ff8f7a; --focus:#ffd23f; --lock:#9aa3c7; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:22px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:#fff}
header .wrap{padding-block:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.6rem;margin:0;line-height:1.15}
header p{margin:0;color:#e3e8ff;font-size:1rem}
.hstars{font-weight:700;font-variant-numeric:tabular-nums;color:#ffd23f}
.vbtn{margin-left:auto}
main .wrap{padding-block:22px 48px;display:flex;flex-direction:column;gap:20px}
h2{font-size:1.6rem;margin:0;text-wrap:balance}
h2:focus{outline:none}
h3{font-size:1.2rem;margin:0}
p{margin:0}
.sub{color:var(--muted)}
.crumb{color:var(--muted);font-size:1rem;font-weight:700}
button,input{font:inherit}
.btn{font-weight:700;font-size:1.1rem;min-height:60px;border:3px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:10px 20px;cursor:pointer;text-align:left}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0b1230}
.btn kbd{font-family:inherit;font-size:.85rem;border:2px solid currentColor;border-radius:6px;padding:0 6px;margin-right:8px;opacity:.85}
:focus-visible{outline:5px solid var(--focus);outline-offset:3px}
header .btn{background:transparent;color:#fff;border-color:#fff;min-height:50px}
header .btn[aria-pressed="true"]{background:var(--gold);color:#0b1230;border-color:var(--gold)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.list .btn{width:100%;height:100%;display:flex;flex-direction:column;gap:2px}
.list small{font-weight:400;color:var(--muted);font-size:.95rem}
.list .btn[aria-disabled="true"]{border-style:dashed;border-color:var(--lock);color:var(--lock)}
.list .btn[aria-disabled="true"] small{color:var(--lock)}
.levels .btn{min-height:130px}
.levels .btn .big{font-size:1.6rem}
.bar{height:12px;border-radius:99px;background:var(--card);border:2px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.tip{background:var(--card);border-left:8px solid var(--gold);border-radius:12px;padding:14px 18px;font-size:1.1rem}
.word{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:8px}
.word .en{font-size:2.6rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.word .es{font-size:1.4rem;color:var(--muted)}
.word .ex{font-size:1.25rem}
.story{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.story p{font-size:1.3rem}
.story p.now{background:var(--gold);color:#0b1230;border-radius:8px;padding:0 6px;margin:0 -6px}
.qtext{font-size:1.55rem;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opts .btn{font-size:1.3rem}
.opts .btn.ok{border-color:var(--good);border-width:6px}
.opts .btn.no{border-color:var(--bad);border-width:6px;text-decoration:line-through}
.feedback{font-size:1.3rem;font-weight:700;min-height:1.5em}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
details summary{cursor:pointer;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blank{letter-spacing:2px}
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chat:empty{display:none}
.bub{border:3px solid var(--line);border-radius:16px;padding:12px 16px;font-size:1.3rem;max-width:92%;overflow-wrap:anywhere}
.bub.ai{background:var(--card);align-self:flex-start}
.bub.me{background:var(--bg);align-self:flex-end;border-style:dashed}
@media (max-width:560px){.opts{grid-template-columns:1fr} .word .en{font-size:2rem}}
</style>

</div></header>

<script>
/* ---------- Preparar contenido ---------- */
function prep(){LEVELS.forEach(l=>l.mods.forEach((m,i)=>{
  m.id=l.id+"-"+(i+1); m.n=i+1; m.level=l;
  m.items=m.learn.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split("|");return {en:p[0].trim(),es:(p[1]||"").trim(),ex:(p[2]||"").trim()}});
  m.qs=parseQ(m.quiz);
  if(m.story&&!m.story.sents){m.story.sents=m.story.text.match(/(?:\b(?:Ms|Mr|Mrs|Dr)\.|[^.!?])+[.!?]+/g).map(s=>s.trim());m.story.qs=parseQ(m.story.qs)}
}))}
function parseQ(block){return block.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split("|").map(x=>x.trim());return {p:p[0],a:p[1],opts:p.slice(1),lang:"en"}})}

/* ---------- Estado ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let scores=store.get("hadash-book-scores",{});
let fullVoice=store.get("hadash-voice",true);
let unlockAll=store.get("hadash-unlock-all",false);
const app=document.getElementById("app"), live=document.getElementById("live");
let view={name:"home"};
const starsOf=id=>{const s=scores[id];if(s==null)return 0;return s>=90?3:s>=60?2:s>=30?1:0};
const done=id=>starsOf(id)>=2;
function unlocked(m){if(unlockAll||m.n===1)return true;return done(m.level.mods[m.n-2].id)}
function nextMod(l){return l.mods.find(m=>!done(m.id)&&unlocked(m))||null}
function totalStars(){return LEVELS.reduce((a,l)=>a+l.mods.reduce((b,m)=>b+starsOf(m.id),0),0)}
let maxStars=0;
function drawStars(){if(!maxStars)return;document.getElementById("hstars").textContent=`★ ${totalStars()} de ${maxStars}`}

/* ---------- Voz ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function pick(lang){return voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang))}
function forSpeech(t){return t.replace(/_{2,}/g," blank ").replace(/[\/·]/g,", ")}
// parts: [[texto, "en"|"es"]]. English always uses the English voice so pronunciation is right.
function say(parts,{force=false,onDone}={}){
  try{
    speechSynthesis.cancel();
    const list=parts.filter(([t,l])=>t&&(l==="en"||fullVoice||force));
    list.forEach(([text,lang],i)=>{
      const u=new SpeechSynthesisUtterance(forSpeech(text));
      u.lang=lang==="en"?"en-US":"es-ES";const v=pick(lang);if(v)u.voice=v;
      u.rate=lang==="en"?.82:1;
      if(onDone)u.onstart=()=>onDone(i);
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
// Text in parentheses is Spanish, the rest English.
function mixed(text){const out=[];text.split(/(\([^)]*\))/).forEach(s=>{if(!s.trim())return;if(s.startsWith("("))out.push([s.slice(1,-1),"es"]);else out.push([s,"en"])});return out}
function announce(t){live.textContent="";setTimeout(()=>live.textContent=t,60)}
let ac;
function tone(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  (ok?[523,659,784]:[330,262]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="sine";
  const t=ac.currentTime+i*.13;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.3)})}catch(e){}}

/* ---------- Módulo: aprender ---------- */
function openMod(m){if(m.items.length)learn(m,0);else if(m.story)story(m,0);else quiz(m)}
function modHead(m){return `<p class="crumb">${esc(m.level.name)} · módulo ${m.n} de ${m.level.mods.length}</p>`}
function modButtons(m,here){
  return `<div class="row">
    ${here!=="learn"&&m.items.length?`<button class="btn" id="goLearn">${kb("A","Aprender")}</button>`:""}
    ${here!=="story"&&m.story?`<button class="btn" id="goStory">${kb("L","Lectura")}</button>`:""}
    ${m.items.length?`<button class="btn" id="goPron">${kb("P","Pronunciar")}</button>`:""}
    ${here!=="quiz"?`<button class="btn primary" id="goQuiz">${kb("Q","Practicar")}</button>`:""}
    <button class="btn" id="rule">${kb("R","Escuchar la regla")}</button>
    <button class="btn" id="back">${kb("Esc","Volver a los módulos")}</button></div>`;
}
function wireMod(m){
  const g=id=>document.getElementById(id);
  if(g("goLearn"))g("goLearn").onclick=()=>learn(m,0);
  if(g("goStory"))g("goStory").onclick=()=>story(m,0);
  if(g("goQuiz"))g("goQuiz").onclick=()=>quiz(m);
  if(g("goPron"))g("goPron").onclick=()=>modPron(m);
  g("rule").onclick=()=>readRule(m);
  g("back").onclick=()=>level(LEVELS.indexOf(m.level),m.n);
}
function readRule(m){announce(m.tip);say([[m.tip,"es"]],{force:true})}
function learn(m,i){

  ${i===0?`<p class="tip">${esc(m.tip)}</p>`:""}
  <p class="count" aria-live="off">Tarjeta ${i+1} de ${m.items.length}</p>
  <div class="word">
    <span class="en" lang="en">${esc(it.en)}</span>
    <span class="es">Significa: ${esc(it.es)}</span>
    ${it.ex&&it.ex!==it.en?`<span class="ex" lang="en">${esc(it.ex)}</span>`:""}
  </div>
  <div class="row">
    <button class="btn primary" id="listen">${kb("Espacio","Escuchar")}</button>
    ${it.en.length<=24?`<button class="btn" id="spell">${kb("D","Deletrear")}</button>`:""}
    <button class="btn" id="prev">${kb("←","Anterior")}</button>
    <button class="btn" id="next">${kb("→","Siguiente")}</button>

  document.getElementById("listen").onclick=speakCard;

  document.getElementById("next").onclick=()=>step(1);

}
function cardParts(it){return [[it.en,"en"],["significa: "+it.es,"es"],[it.ex&&it.ex!==it.en?it.ex:"","en"]]}
function speakCard(){say(cardParts(view.m.items[view.i]))}
function spell(){const en=view.m.items[view.i].en;if(en.length>24)return;
  say([[en.replace(/[^A-Za-z ]/g,"").split("").map(c=>c===" "?",":c).join(". ")+".","en"],[en,"en"]],{force:true})}
function step(d){const n=view.m.items.length,i=view.i+d;
  if(i>=n){const msg="Terminaste las tarjetas. Presiona Q para practicar"+(view.m.story?", o L para la lectura.":".");announce(msg);say([[msg,"es"]]);return}

function mark(j){app.querySelectorAll("[data-s]").forEach(p=>p.classList.toggle("now",+p.dataset.s===j))}

function readOne(){say([[view.m.story.sents[view.i],"en"]])}
function sStep(d){const n=view.m.story.sents.length,i=Math.max(0,Math.min(n-1,view.i+d));view.i=i;mark(i);

/* ---------- Práctica ---------- */
function vocabQs(m,n){
  if(m.items.length<3)return[];
  return shuffle(m.items).slice(0,n).map((it,k)=>{
    const others=shuffle(m.items.filter(x=>x!==it));
    if(k%2===0){const opts=[it.es,...others.slice(0,3).map(x=>x.es)];return {p:"",kind:"meaning",word:it.en,a:it.es,opts,lang:"es"}}
    const opts=[it.en,...others.slice(0,3).map(x=>x.en)];return {p:"",kind:"say",word:it.es,a:it.en,opts,lang:"en"};
  });
}
function quiz(m){
  const g=shuffle(m.qs), st=m.story?m.story.qs.map(q=>({...q,story:true})):[];
  const nv=Math.max(m.items.length>=3?2:0,Math.min(4,10-g.length-st.length));
  const qs=[...shuffle([...g,...vocabQs(m,nv)]),...st].map(q=>({...q,opts:shuffle(q.opts)}));
  view={name:"quiz",m,qs,n:0,right:0,answered:false};ask();
}
function qText(q){
  if(q.kind==="meaning")return {html:`¿Qué significa <span lang="en">${esc(q.word)}</span>?`,speech:[["¿Qué significa","es"],[q.word,"en"],["?","es"]]};
  if(q.kind==="say")return {html:`¿Cómo se dice «${esc(q.word)}» en inglés?`,speech:[[`¿Cómo se dice ${q.word} en inglés?`,"es"]]};
  const pre=q.story?"Sobre la lectura. ":(q.p.includes("___")?"Completa. ":"");
  return {html:(pre?`<span class="sub">${pre}</span>`:"")+`<span lang="en">${showQ(q.p)}</span>`,speech:[[pre,"es"],...mixed(q.p)]};
}
function ask(){
  const v=view;if(v.n>=v.qs.length)return finish();
  const q=v.qs[v.n];v.answered=false;const t=qText(q);
  const long=q.opts.some(o=>o.length>28);
  app.innerHTML=`${modHead(v.m)}<h2>Pregunta ${v.n+1} de ${v.qs.length}</h2>
  <p class="qtext">${t.html}</p>
  <div class="opts${long?" one":""}" role="group" aria-label="Opciones">${q.opts.map((o,i)=>`<button class="btn" data-i="${i}"${q.lang==="en"?' lang="en"':""}>${kb(i+1,esc(o))}</button>`).join("")}</div>
  <p class="feedback" id="fb"></p>
  <div class="row"><button class="btn" id="repeat">${kb("E","Escuchar la pregunta")}</button>
  <button class="btn" id="rule">${kb("R","Escuchar la regla")}</button>
  <button class="btn" id="back">${kb("Esc","Salir de la práctica")}</button></div>`;
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  document.getElementById("repeat").onclick=readQ;
  document.getElementById("rule").onclick=()=>readRule(v.m);
  document.getElementById("back").onclick=()=>openMod(v.m);
  focusTitle();readQ();
}
function readQ(){const v=view,q=v.qs[v.n];
  say([[`Pregunta ${v.n+1}.`,"es"],...qText(q).speech,...q.opts.flatMap((o,i)=>[[`${i+1}.`,"es"],[o,q.lang]])])}
function choose(i){
  const v=view;if(v.answered)return;v.answered=true;
  const q=v.qs[v.n],ok=q.opts[i]===q.a;if(ok)v.right++;
  app.querySelectorAll("[data-i]").forEach((b,j)=>{b.setAttribute("aria-disabled","true");if(q.opts[j]===q.a)b.classList.add("ok")});
  if(!ok)app.querySelector(`[data-i="${i}"]`).classList.add("no");
  tone(ok);
  const full=q.p&&q.p.includes("___")?q.p.replace(/\([^)]*\)/g,"").replace(/_{2,}/,q.a).trim():"";
  const msg=ok?"¡Correcto!":`Casi. La respuesta correcta es: ${q.a}.`;
  const fb=document.getElementById("fb");fb.textContent=msg+(full?" "+full:"");fb.className="feedback "+(ok?"ok":"no");
  const next=document.createElement("button");next.className="btn primary";next.id="next";
  next.innerHTML=kb("Enter",v.n+1<v.qs.length?"Siguiente pregunta":"Ver resultado");next.onclick=()=>{v.n++;ask()};
  fb.after(next);
  announce(msg+(full?" "+full:"")+" Presiona Enter para seguir.");
  setTimeout(()=>{say([[ok?"¡Correcto!":"Casi. La respuesta correcta es:","es"],[ok?"":q.a,q.lang],[full,"en"]]);next.focus()},350);
}
function finish(){
  const v=view,m=v.m,pct=Math.round(v.right/v.qs.length*100);
  const before=starsOf(m.id);
  if(pct>(scores[m.id]??-1)){scores[m.id]=pct;store.set("hadash-book-scores",scores)}
  const s=pct>=90?3:pct>=60?2:pct>=30?1:0;
  const nx=m.level.mods[m.n];
  const opened=before<2&&s>=2&&nx;
  const msg=s===3?"¡Excelente! Eres una estrella.":s===2?"¡Muy bien! Lo lograste.":s===1?"¡Buen intento! Repasa las tarjetas y vuelve a practicar.":"Sigue practicando. ¡Tú puedes!";
  view={name:"done",m};drawStars();
  app.innerHTML=`${modHead(m)}<h2>Terminaste: ${v.right} de ${v.qs.length} correctas</h2>
  <p style="font-size:1.4rem">${s} de 3 estrellas. ${msg}</p>
  ${opened?`<p class="tip">Abriste el módulo ${nx.n}: <span lang="en">${esc(nx.title)}</span>.</p>`:""}
  ${s<2?`<p class="tip">Necesitas 2 estrellas, es decir 60 por ciento, para abrir el siguiente módulo.</p>`:""}
  <div class="row">
    ${nx&&unlocked(nx)?`<button class="btn primary" id="nextMod">${kb("C","Siguiente módulo")}</button>`:""}
    <button class="btn${nx&&unlocked(nx)?"":" primary"}" id="again">${kb("Q","Practicar otra vez")}</button>
    <button class="btn" id="study">${kb("A","Repasar")}</button>
    <button class="btn" id="back">${kb("Esc","Volver a los módulos")}</button></div>`;
  if(document.getElementById("nextMod"))document.getElementById("nextMod").onclick=()=>openMod(nx);
  document.getElementById("again").onclick=()=>quiz(m);
  document.getElementById("study").onclick=()=>openMod(m);
  document.getElementById("back").onclick=()=>level(LEVELS.indexOf(m.level),m.n);
  focusTitle();tone(s>=2);
  say([[`Terminaste. ${v.right} de ${v.qs.length} correctas. ${s} de 3 estrellas. ${msg}`+(opened?` Abriste el módulo ${nx.n}.`:""),"es"]]);
}

const PRAISE=["Great!","Nice!","Good job!","Cool!","Wonderful!","Thanks for sharing!","Very good!","Awesome!"];
const PAST={go:"went",eat:"ate",have:"had",do:"did",see:"saw",play:"played",watch:"watched",visit:"visited",study:"studied",make:"made",buy:"bought",come:"came",take:"took",drink:"drank",start:"started",read:"read",swim:"swam",listen:"listened",cook:"cooked",travel:"traveled"};
const THIRD={have:"has",like:"likes",want:"wants",go:"goes",live:"lives",play:"plays",eat:"eats",work:"works",do:"does",study:"studies",watch:"watches",need:"needs",love:"loves"};
/* Revisa una respuesta y devuelve UN consejo en español (o "") */
function grammarTip(said,q){
  const t=" "+said.toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ")+" ";
  let m;
  if(/ i have (\d+|[a-z-]+) years /.test(t))return 'Para decir la edad usamos "am": "I am twelve years old".';
  if((m=t.match(/ (he|she|it) don't /)))return `Con ${m[1]} decimos "doesn't": "${m[1]} doesn't".`;
  if((m=t.match(/ (he|she|it) (have|like|want|go|live|play|eat|work|do|study|watch|need|love) /)))return `Con ${m[1]} el verbo lleva "s": "${m[1]} ${THIRD[m[2]]}".`;
  if(/ i am agree /.test(t))return 'Se dice "I agree", sin "am".';
  if(/ people is /.test(t))return '"People" es plural: decimos "people are".';
  if((m=t.match(/ more (good|bad|big) /)))return `Decimos "${{good:"better",bad:"worse",big:"bigger"}[m[1]]}", no "more ${m[1]}".`;
  if(/ i am (agree|like|have|go|live|want) /.test(t)&&!/ i am going /.test(t))return 'Con verbos como like o have no usamos "am": "I like", "I have".';
  if(q.past&&(m=t.match(/ (?:i|we|they|he|she) (go|eat|have|do|see|play|watch|visit|study|make|buy|come|take|drink|start|swim|listen|cook|travel) /)))return `Esta pregunta es en pasado: decimos "${PAST[m[1]]}" en vez de "${m[1]}".`;
  if(/^ (is|are) /.test(t))return 'En inglés siempre ponemos el sujeto: "It is..." o "They are...".';
  return "";
}
function guidedQs(ti,li){return GUIDE[ti].filter(x=>x.lv<=li+1)}
function guidedStart(){
  const v=view;v.guided=true;v.qs=guidedQs(v.ti,v.li);v.k=0;v.tips=[];v.answers=0;
  const hi=`Hi! I am Sunny. Let's practice English together. `;
  sayGuided(hi+v.qs[0].q);
}
function sayGuided(text){const v=view;addBubble("ai",text);v.turns.push({role:"assistant",content:text});v.last=text;sunnySpeaks()}
function guidedAnswer(text){
  const v=view,q=v.qs[v.k];
  v.answers++;
  const words=text.trim().split(/\s+/).length;
  let msg=PRAISE[Math.floor(Math.random()*PRAISE.length)]+" ";
  if(q.name){const n=text.match(/(?:name is|name's|i am|i'm|call me)\s+([a-záéíóúñ]+)/i)||(words<=2?[0,text.trim().split(/\s+/).pop()]:null);if(n){v.who=n[1][0].toUpperCase()+n[1].slice(1);msg=`Nice to meet you, ${v.who}! `}}
  const tip=grammarTip(text,q);
  if(tip){v.tips.push(tip);msg=`(Pequeño consejo: ${tip}) `+msg}
  else if(words<3&&!q.name){msg+=`(Intenta con una oración completa, por ejemplo: "${q.m}") `;v.tips.push(`Responder con oraciones completas, como "${q.m}"`)}
  v.k++;
  if(v.k>=v.qs.length){
    msg+=`That was fun${v.who?", "+v.who:""}! You did a great job. (Presiona F para escuchar tus consejos, o Escape para elegir otro tema.)`;
    v.over=true;sayGuided(msg);return}
  sayGuided(msg+v.qs[v.k].q);
}
function guidedHelp(){
  const v=view;if(!v.guided||v.over)return;const q=v.qs[v.k];stopRec();
  const t=`(La pregunta significa: ${q.es} Puedes responder así: "${q.m}")`;
  setStatus("Ayuda: "+q.es+" Ejemplo: "+q.m,true);

}
function guidedFinish(v){
  const tips=[...new Set(v.tips)];
  let t=`¡Muy bien${v.who?", "+v.who:""}! Hoy respondiste ${v.answers} ${v.answers===1?"pregunta":"preguntas"} en inglés. `;
  if(tips.length)t+="Para mejorar: "+tips.slice(0,3).join(" También: ")+" ";
  else t+="No encontré errores en tus respuestas. ¡Excelente trabajo! ";
  t+="Sigue practicando todos los días, aunque sean cinco minutos.";
  return t;
}

  if(n==="level"&&k==="c"){const nx=nextMod(LEVELS[view.li]);if(nx){stop();openMod(nx)}return}
  if(m&&k==="r"){stop();return readRule(m)}
  if(m&&n!=="quiz"){
    if(k==="q"){stop();return quiz(m)}
    if(k==="a"&&m.items.length){stop();return learn(m,0)}
    if(k==="l"&&m.story){stop();return story(m,0)}
    if(k==="p"&&m.items.length&&["learn","story","done"].includes(n)){stop();return modPron(m)}
  }
  if(n==="learn"){
    if(k==="arrowright"){stop();step(1)}else if(k==="arrowleft"){stop();step(-1)}
    else if(k===" "&&!e.target.matches("button")){stop();speakCard()}
    else if(k==="d"){stop();spell()}
  }else if(n==="story"){
    if(k==="arrowright"){stop();sStep(1)}else if(k==="arrowleft"){stop();sStep(-1)}
    else if(k===" "&&!e.target.matches("button")){stop();readAll()}
    else if(k==="enter"&&!e.target.matches("button")){stop();readOne()}
  }else if(n==="quiz"){
    if(/^[1-4]$/.test(k)&&!view.answered&&+k<=view.qs[view.n].opts.length){stop();choose(+k-1)}
    else if(k==="e"){stop();readQ()}
  }else if(n==="done"&&k==="c"){const nx=m.level.mods[m.n];if(nx&&unlocked(nx)){stop();openMod(nx)}}
});
/* ---------- Código de acceso ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=c=>c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
async function openWith(code){
  try{
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(code)),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SEALED.salt),iterations:SEALED.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(SEALED.iv)},key,b64(SEALED.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }catch(e){return null}
}
function boot(levels){
  LEVELS=levels;prep();maxStars=LEVELS.reduce((a,l)=>a+l.mods.length*3,0);drawStars();home();
}
function lock(msg){
  view={name:"lock"};
  app.innerHTML=`<h2>Escribe el código de la clase</h2>
  <p class="sub">Tu profesora te da este código. Solo lo escribes una vez en esta computadora.</p>
  <form class="panel" id="lockf" autocomplete="off">
    <label for="code" style="font-weight:700">Código de acceso</label>
    <input id="code" type="password" style="font-size:1.4rem;padding:12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)" aria-describedby="lockerr" autocapitalize="off" spellcheck="false">
    <p class="feedback no" id="lockerr" role="alert">${msg||""}</p>
    <div class="row"><button class="btn primary" type="submit">${kb("Enter","Entrar")}</button></div>
  </form>`;
  const f=document.getElementById("lockf"),inp=document.getElementById("code");
  inp.focus();
  f.onsubmit=async e=>{e.preventDefault();
    const code=inp.value;if(!code.trim())return;
    const lv=await openWith(code);
    if(!lv){const m="Ese código no es correcto. Revisa y escríbelo otra vez.";document.getElementById("lockerr").textContent=m;say([[m,"es"]]);tone(false);inp.select();return}
    store.set("hadash-code",code);tone(true);boot(lv);
    say([["¡Bienvenido! Elige tu nivel. Presiona 1, 2 o 3.","es"]]);
  };
  say([["Escribe el código de la clase y presiona Enter.","es"]]);
}
(async()=>{
  const saved=store.get("hadash-code",null);
  if(saved){const lv=await openWith(saved);if(lv)return boot(lv);
    try{localStorage.removeItem("hadash-code")}catch(e){}
    return lock("El código de la clase cambió. Pídele el nuevo código a tu profesora.")}
  lock();
})();
</script>
