<style>
/* Layout: audio-first, keyboard-first single column. Levels > modules > learn / story / practice. Large type and strong contrast for low vision. */
:root{
  --navy:#14214a; --gold:#f2b705; --bg:#ffffff; --card:#f3f5fb; --fg:#0b1230; --muted:#38415f; --line:#14214a;
  --good:#0b6b3a; --bad:#a3200b; --focus:#f2b705; --lock:#6b7290;
  --font:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0a1230; --gold:#ffd23f; --bg:#05081a; --card:#121a3c; --fg:#ffffff; --muted:#dfe4ff; --line:#ffd23f;
  --good:#6ee7a8; --bad:#ff8f7a; --focus:#ffd23f; --lock:#9aa3c7; color-scheme:dark }}
:root[data-theme="dark"]{
  --navy:#0a1230; --gold:#ffd23f; --bg:#05081a; --card:#121a3c; --fg:#ffffff; --muted:#dfe4ff; --line:#ffd23f;
  --good:#6ee7a8; --bad:#ff8f7a; --focus:#ffd23f; --lock:#9aa3c7; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:22px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:#fff}
header .wrap{padding-block:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.6rem;margin:0;line-height:1.15}
header p{margin:0;color:#e3e8ff;font-size:1rem}
.hstars{font-weight:700;font-variant-numeric:tabular-nums;color:#ffd23f}
.vbtn{margin-left:auto}
main .wrap{padding-block:22px 48px;display:flex;flex-direction:column;gap:20px}
h2{font-size:1.6rem;margin:0;text-wrap:balance}
h2:focus{outline:none}
h3{font-size:1.2rem;margin:0}
p{margin:0}
.sub{color:var(--muted)}
.crumb{color:var(--muted);font-size:1rem;font-weight:700}
button,input{font:inherit}
.btn{font-weight:700;font-size:1.1rem;min-height:60px;border:3px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:10px 20px;cursor:pointer;text-align:left}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0b1230}
.btn kbd{font-family:inherit;font-size:.85rem;border:2px solid currentColor;border-radius:6px;padding:0 6px;margin-right:8px;opacity:.85}
:focus-visible{outline:5px solid var(--focus);outline-offset:3px}
header .btn{background:transparent;color:#fff;border-color:#fff;min-height:50px}
header .btn[aria-pressed="true"]{background:var(--gold);color:#0b1230;border-color:var(--gold)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.list .btn{width:100%;height:100%;display:flex;flex-direction:column;gap:2px}
.list small{font-weight:400;color:var(--muted);font-size:.95rem}
.list .btn[aria-disabled="true"]{border-style:dashed;border-color:var(--lock);color:var(--lock)}
.list .btn[aria-disabled="true"] small{color:var(--lock)}
.levels .btn{min-height:130px}
.levels .btn .big{font-size:1.6rem}
.bar{height:12px;border-radius:99px;background:var(--card);border:2px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.tip{background:var(--card);border-left:8px solid var(--gold);border-radius:12px;padding:14px 18px;font-size:1.1rem}
.word{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:8px}
.word .en{font-size:2.6rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.word .es{font-size:1.4rem;color:var(--muted)}
.word .ex{font-size:1.25rem}
.story{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.story p{font-size:1.3rem}
.story p.now{background:var(--gold);color:#0b1230;border-radius:8px;padding:0 6px;margin:0 -6px}
.qtext{font-size:1.55rem;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opts .btn{font-size:1.3rem}
.opts .btn.ok{border-color:var(--good);border-width:6px}
.opts .btn.no{border-color:var(--bad);border-width:6px;text-decoration:line-through}
.feedback{font-size:1.3rem;font-weight:700;min-height:1.5em}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
details summary{cursor:pointer;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blank{letter-spacing:2px}
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.chat:empty{display:none}
.bub{border:3px solid var(--line);border-radius:16px;padding:12px 16px;font-size:1.3rem;max-width:92%;overflow-wrap:anywhere}
.bub.ai{background:var(--card);align-self:flex-start}
.bub.me{background:var(--bg);align-self:flex-end;border-style:dashed}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.forms span{display:flex;flex-direction:column;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:1.3rem;font-weight:700;min-width:0;overflow-wrap:anywhere}
.forms small{font-size:.85rem;color:var(--muted);font-weight:700}
.word .ex2{font-size:1.2rem}
.opts .btn[aria-disabled="true"]{cursor:default}
@media (max-width:560px){.forms{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.opts{grid-template-columns:1fr} .word .en{font-size:2rem}}
</style>

<script>
/* ---------- Preparar contenido ---------- */
function prep(){LEVELS.forEach(l=>l.mods.forEach((m,i)=>{
  m.id=l.id+"-"+(i+1); m.n=i+1; m.level=l;
  m.items=m.learn.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split("|");return {en:p[0].trim(),es:(p[1]||"").trim(),ex:(p[2]||"").trim()}});
  m.qs=parseQ(m.quiz);
  if(m.story&&!m.story.sents){m.story.sents=m.story.text.match(/(?:\b(?:Ms|Mr|Mrs|Dr)\.|[^.!?])+[.!?]+/g).map(s=>s.trim());m.story.qs=parseQ(m.story.qs)}
}))}
function parseQ(block){return block.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split("|").map(x=>x.trim());return {p:p[0],a:p[1],opts:p.slice(1),lang:"en"}})}

/* ---------- Estado ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let scores=store.get("hadash-book-scores",{});
let fullVoice=store.get("hadash-voice",true);
let unlockAll=store.get("hadash-unlock-all",true);
const app=document.getElementById("app"), live=document.getElementById("live");
let view={name:"home"};
const starsOf=id=>{const s=scores[id];if(s==null)return 0;return s>=90?3:s>=60?2:s>=30?1:0};
const done=id=>starsOf(id)>=2;
function unlocked(m){if(unlockAll||m.n===1)return true;return done(m.level.mods[m.n-2].id)}
function nextMod(l){return l.mods.find(m=>!done(m.id)&&unlocked(m))||null}
function totalStars(){return LEVELS.reduce((a,l)=>a+l.mods.reduce((b,m)=>b+starsOf(m.id),0),0)}
let maxStars=0;
function drawStars(){if(!maxStars)return;document.getElementById("hstars").textContent=`★ ${totalStars()} de ${maxStars}`}

/* ---------- Voz ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function vq(v){const n=v.name+' '+(v.voiceURI||''),l=(v.lang||'').replace('_','-').toLowerCase();let s=1;if(/natural|neural/i.test(n))s=6;else if(/online/i.test(n))s=5;else if(/google|premium|enhanced|siri/i.test(n))s=4;else if(/samantha|ava|allison|alex|daniel|karen|moira|paulina|monica|juan/i.test(n))s=3;if(/zira|david|mark|hazel|helena|sabina|espeak|compact/i.test(n))s=0;if(l==='en-us'||l==='es-us'||l==='es-mx'||l==='es-419')s+=0.5;return s}const goodFirst=a=>[...a].sort((x,y)=>vq(y)-vq(x));function pick(lang){return goodFirst(voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang)))[0]}
const FEMV=/\b(female|woman|samantha|victoria|karen|moira|tessa|fiona|veena|zira|aria|jenny|ava|ana|allison|susan|hazel|libby|sonia|michelle|emma|joanna|salli|kimberly|ivy|kendra|nicky|serena|catherine|natasha|clara|martha|kathy|shelley|sandy|flo|grandma|nora|amy|ruth|google us english|x-sfg|x-tpc|x-tpf|x-iob|x-iog|x-gba|x-gbc|x-gbg|x-fis)\b/i;const MALV=/\b(male|man|alex|daniel|fred|tom|aaron|arthur|oliver|gordon|rishi|david|mark|guy|ryan|george|christopher|eric|brian|matthew|joey|justin|william|liam|andrew|roger|steffan|davis|jason|tony|grandpa|rocko|reed|eddy|ralph|albert|stephen|x-iol|x-iom|x-tpd|x-gbb|x-gbd|x-rjs)\b/i;function vgen(v){const n=v.name+' '+(v.voiceURI||'');return /female/i.test(n)?'f':MALV.test(n)?'m':FEMV.test(n)?'f':'?'}function pickG(lang,g,idx){const L=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));const us=a=>{const b=a.filter(v=>/en[-_]us/i.test(v.lang));return goodFirst(b.length?b:a)};let pool=us(L.filter(v=>vgen(v)===g)),match=true;if(!pool.length){pool=us(L.filter(v=>vgen(v)==='?'));match=false}if(!pool.length){pool=us(L);match=false}return {v:pool.length?pool[(idx||0)%pool.length]:null,p:match?1:(g==='m'?0.6:1.2)}}
function forSpeech(t){return t.replace(/_{2,}/g," blank ").replace(/[\/·]/g,", ")}
// parts: [[texto, "en"|"es"]]. English always uses the English voice so pronunciation is right.
function say(parts,{force=false,onDone}={}){
  try{
    stopAll();
    const list=parts.filter(([t,l])=>t&&(l==="en"||fullVoice||force));
    list.forEach(([text,lang],i)=>{
      const u=new SpeechSynthesisUtterance(forSpeech(text));
      u.lang=lang==="en"?"en-US":"es-ES";const v=pick(lang);if(v)u.voice=v;
      u.rate=lang==="en"?.82:1;
      if(onDone)u.onstart=()=>onDone(i);

function vocabQs(m,n){
  if(m.items.length<3)return[];
  return shuffle(m.items).slice(0,n).map((it,k)=>{
    const others=shuffle(m.items.filter(x=>x!==it));
    if(k%2===0){const opts=[it.es,...others.slice(0,3).map(x=>x.es)];return {p:"",kind:"meaning",word:it.en,a:it.es,opts,lang:"es"}}
    const opts=[it.en,...others.slice(0,3).map(x=>x.en)];return {p:"",kind:"say",word:it.es,a:it.en,opts,lang:"en"};
  });
}
function quiz(m){
  const g=shuffle(m.qs), st=m.story?m.story.qs.map(q=>({...q,story:true})):[];
  const nv=Math.max(m.items.length>=3?2:0,Math.min(4,10-g.length-st.length));
  const qs=[...shuffle([...g,...vocabQs(m,nv)]),...st].map(q=>({...q,opts:shuffle(q.opts)}));
  view={name:"quiz",m,qs,n:0,right:0,answered:false};ask();
}
function qText(q){
  if(q.kind==="meaning")return {html:`¿Qué significa <span lang="en">${esc(q.word)}</span>?`,speech:[["¿Qué significa","es"],[q.word,"en"],["?","es"]]};
  if(q.kind==="say")return {html:`¿Cómo se dice «${esc(q.word)}» en inglés?`,speech:[[`¿Cómo se dice ${q.word} en inglés?`,"es"]]};
  const pre=q.story?"Sobre la lectura. ":(q.p.includes("___")?"Completa. ":"");
  return {html:(pre?`<span class="sub">${pre}</span>`:"")+`<span lang="en">${showQ(q.p)}</span>`,speech:[[pre,"es"],...mixed(q.p)]};
}

  if(r.status===401||r.status===409){try{localStorage.removeItem("hadash-sunny-code");localStorage.removeItem("hadash-code")}catch(e){}lock(HadashAccess.MSG[r.status===409?"other_device":"invalid_code"]);throw {code:"cancelled"}}

}

function guidedQs(ti,li){

  const units=[],seen={};
  pool.filter(x=>!x.first).forEach(x=>{if(x.grp){if(!seen[x.grp]){seen[x.grp]=[];units.push(seen[x.grp])}seen[x.grp].push(x)}else units.push([x])});

  const take=(list,limit)=>{for(const u of list){if(count>=limit)break;if(count+u.length>n)continue;pick.push(u);count+=u.length}};

function guidedAnswer(text){
  const v=view,q=v.qs[v.k];

  if((LOST.test(text)&&words<=5&&!grammarTip(text,q)||esCount>=2&&esCount>=words/2)&&!v.helped){

    if(v.k>=v.qs.length){v.over=true;sayGuided(`(Recuerda contestar en inglés. Podías decir: "${q.m}") That was fun! (Presiona F para escuchar tus consejos, o Escape para elegir otro tema.)`);return}
    sayGuided(`(Recuerda contestar en inglés. Podías decir: "${q.m}") Let's go on. ${v.qs[v.k].q}`);return}
  let msg=PRAISE[Math.floor(Math.random()*PRAISE.length)]+" ";

    if(same<.5&&v.answers%2===0)msg+=`(Otra forma de decirlo: "${q.m}") `;
  }

function guidedHelp(){
  const v=view;if(!v.guided||v.over)return;const q=v.qs[v.k];stopRec();
  const t=`(La pregunta significa: ${q.es} Puedes responder así: "${q.m}")`;
  setStatus("Ayuda: "+q.es+" Ejemplo: "+q.m,true);
  speakThen(convParts(t),()=>{if(view===v&&handsFree&&SR&&!micBlocked)listen()});
}
function guidedFinish(v){
  const tips=[...new Set(v.tips)];
  let t=`¡Muy bien${v.who?", "+v.who:""}! Hoy respondiste ${v.answers} ${v.answers===1?"pregunta":"preguntas"} en inglés. `;
  if(v.good)t+=`${v.good} de tus respuestas fueron oraciones completas y claras. `;
  if(tips.length)t+="Para mejorar: "+tips.slice(0,3).join(" También: ")+" ";
  else t+="No encontré errores en tus respuestas. ¡Excelente trabajo! ";
  t+="Sigue practicando todos los días, aunque sean cinco minutos.";
  return t;
}

/* ---------- Herramientas comunes de los módulos nuevos ---------- */
const chunk=(a,n)=>{const out=[];for(let i=0;i<a.length;i+=n)out.push(a.slice(i,i+n));return out};
const drillScores=store.get("hadash-drills",{});
function saveDrill(key,pct){drillScores[key]=Math.max(pct,drillScores[key]||0);store.set("hadash-drills",drillScores)}
const scoreNote=key=>drillScores[key]!=null?` Mejor prueba: ${drillScores[key]} por ciento.`:"";
/* Menú de una lista: practicar, prueba y (opcional) oraciones */
function listMenu(cfg){
  view={name:"menu",back:cfg.back};
  app.innerHTML=`<p class="crumb">${esc(cfg.crumb)}</p><h2>${esc(cfg.title)}</h2>
  ${cfg.tip?`<p class="tip">${esc(cfg.tip)}</p>`:""}
  <p class="sub">${esc(cfg.preview)}</p>
  <ul class="list">${cfg.opts.map(o=>`<li><button class="btn" data-k="${o.k}"><span><kbd>${o.k.toUpperCase()}</kbd>${esc(o.t)}</span><small>${esc(o.d)}</small></button></li>`).join("")}</ul>
  <div class="row"><button class="btn" id="back">${kb("Esc","Volver")}</button></div>`;
  view.keys={};cfg.opts.forEach(o=>view.keys[o.k]=o.go);
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>view.keys[b.dataset.k]());
  document.getElementById("back").onclick=cfg.back;
  focusTitle();
  say([[cfg.title+". "+cfg.opts.map(o=>o.k.toUpperCase()+", "+o.t).join(". ")+".","es"]]);
}
/* Prueba genérica de opción múltiple. q: {p, parts, a, opts, after} */
function drill(cfg){
  view={name:"drill",cfg,qs:cfg.qs,n:0,right:0,answered:false,back:cfg.back};
  drillAsk();
}
function drillAsk(){
  const v=view;if(v.n>=v.qs.length)return drillDone();
  const q=v.qs[v.n];v.answered=false;
  app.innerHTML=`<p class="crumb">${esc(v.cfg.crumb)}</p><h2>${esc(v.cfg.title)}</h2>
  <p class="count">Pregunta ${v.n+1} de ${v.qs.length}</p>
  <p class="qtext">${q.html||esc(q.p)}</p>
  <div class="opts${q.opts.some(o=>o.length>24)?" one":""}">${q.opts.map((o,i)=>`<button class="btn" data-o="${i}" lang="${q.lang||"en"}"><kbd>${i+1}</kbd>${esc(o)}</button>`).join("")}</div>
  <p class="feedback" id="fb" role="status" aria-live="assertive"></p>
  <div class="row"><button class="btn" id="rep">${kb("E","Escuchar la pregunta")}</button>${v.cfg.extra?`<button class="btn" id="ext">${kb(v.cfg.extra.k.toUpperCase(),v.cfg.extra.t)}</button>`:""}<button class="btn" id="back">${kb("Esc","Salir")}</button></div>`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>drillChoose(+b.dataset.o));
  document.getElementById("rep").onclick=drillRead;document.getElementById("back").onclick=v.back;
  if(v.cfg.extra)document.getElementById("ext").onclick=v.cfg.extra.go;

function sentCheck(text,alts){
  const v=TLISTS[view.li][view.i];alts=alts||[text];

    const j=judge(v.ex,alts);
    if(j.r>=.85){view.mode="free";document.getElementById("sinstr").textContent="Ahora intenta tu propia oración con "+v.f+", o pasa al siguiente verbo con la flecha derecha.";
      return sentFb(`¡Excelente! Te entendí: ${j.txt}`,[["¡Excelente! Ahora intenta tu propia oración, o pasa al siguiente verbo.","es"]],true)}
    return sentFb(`Te entendí: ${j.txt}. Escucha otra vez y repite.`,[["Casi. Escucha otra vez:","es"],[v.ex,"en"]],false);
  }
  const best=alts.map(a=>({a,w:words(a)})).find(x=>x.w.includes(v.f))||{a:text,w:words(text)};
  const w=best.w;
  if(w.length<3)return sentFb(`Te entendí: ${best.a}. Haz una oración un poco más larga, por ejemplo: ${v.ex}`,[["Haz una oración un poco más larga. Por ejemplo:","es"],[v.ex,"en"]],false);
  const pos=w.indexOf(v.f);
  if(pos<0){
    const bpos=w.indexOf(v.b);
    if(bpos>0&&["he","she","it"].includes(w[bpos-1]))return sentFb(`Te entendí: ${best.a}. Con ${w[bpos-1]} el verbo cambia: ${w[bpos-1]} ${v.f}.`,[["Casi. Con","es"],[w[bpos-1],"en"],["el verbo cambia:","es"],[`${w[bpos-1]} ${v.f}`,"en"]],false);
    return sentFb(`Te entendí: ${best.a}. No escuché la palabra ${v.f}. Intenta otra vez, o presiona A para un ejemplo.`,[["No escuché la palabra","es"],[v.f,"en"],["Intenta otra vez, o presiona A para un ejemplo.","es"]],false);
  }
  const before=w[pos-1];
  if(["i","you","we","they"].includes(before))return sentFb(`Te entendí: ${best.a}. Con ${before==="i"?"I":before} el verbo no lleva s: ${before==="i"?"I":before} ${v.b}. Usa he, she o un nombre con ${v.f}.`,[["Con","es"],[before,"en"],["no lleva s. Usa he, she o un nombre con","es"],[v.f,"en"]],false);
  const stars=["¡Excelente!","¡Muy bien!","¡Perfecto!"][Math.floor(Math.random()*3)];
  return sentFb(`${stars} Dijiste: ${best.a}`,[[stars+" Dijiste:","es"],[best.a,"en"],["Presiona la flecha derecha para el siguiente verbo.","es"]],true);
}

  a.onended=()=>done(true);a.onerror=()=>done(false);a.onpause=()=>{if(!a.ended)done(true)};const pr=a.play();if(pr&&pr.catch)pr.catch(()=>done(false))})}

  if(n==="home"&&/^[1-3]$/.test(k)){stop();return level(+k-1)}
  if(n==="home"&&k==="4"){stop();return lab()}
  if(n==="home"&&k==="5"){stop();return conv()}
  if(n==="home"&&k==="6"){stop();return verbsHub()}
  if(n==="home"&&k==="7"){stop();return thirdHub()}

  if(n==="hub"){if(/^[0-9]$/.test(k)&&view.pick){stop();return view.pick(k==="0"?9:+k-1)}if(k==="r"){const b=document.getElementById("vtip")||document.getElementById("ttip");if(b){stop();b.click()}}return}
  if(n==="menu"){if(view.keys&&view.keys[k]){stop();return view.keys[k]()}return}
  if(n==="drill"){const q=view.qs[view.n];if(/^[1-4]$/.test(k)&&!view.answered&&+k<=q.opts.length){stop();return drillChoose(+k-1)}if(k==="e"){stop();return drillRead()}if(view.cfg.extra&&k===view.cfg.extra.k){stop();return view.cfg.extra.go()}return}
  if(n==="drilldone"){if(k==="r"){stop();return view.cfg.retry()}return}
  if(n==="sent"){if(k==="g"){stop();return sentListen()}if(k==="a"){stop();return sentHelp()}if(k==="arrowright"){stop();return sentStep(1)}if(k==="arrowleft"){stop();return sentStep(-1)}return}
  if(n==="lstory"){if(k===" "&&!e.target.matches("button,summary")){stop();return lPlay(false)}if(k==="s"){stop();return lPlay(true)}if(k==="arrowright"){stop();return lLine(1)}if(k==="arrowleft"){stop();return lLine(-1)}if(k==="q"){stop();return listenDrill(view.si)}return}
  if(n==="conv"){if(/^[1-6]$/.test(k)){stop();return talk(+k-1)}if(k==="n"){stop();return setConvLevel((convLevel+1)%CONV_LEVELS.length)}return}
  if(n==="talk"){
    if(k===" "&&!e.target.matches("button")){stop();return listen()}
    if(k==="e"){stop();return replay(false)}
    if(k==="s"){stop();return replay(true)}
    if(k==="m"){stop();return toggleHands()}
    if(k==="f"){stop();return finishTalk()}
    if(k==="a"&&view.guided){stop();return guidedHelp()}
    return}
  if(n==="talkdone"){if(k==="c"){stop();return talk(view.ti)}if(k==="e"&&view.last){stop();return speakThen(convParts(view.last,"es"))}return}
  if(n==="lab"&&/^[1-9]$/.test(k)){stop();return sound(+k-1)}
  if(n==="pron"){const c=view.cfg;
    if(k==="g"){stop();return record()}
    if(k==="s"){stop();return model(.55)}
    if(k==="arrowright"){stop();return pStep(1)}
    if(k==="arrowleft"){stop();return pStep(-1)}

    if(k==="q"&&c.si!=null&&(SOUNDS[c.si].pairs||SOUNDS[c.si].ear)){stop();return ear(c.si)}

  if(n==="ear"){if(/^[1-3]$/.test(k)&&!view.answered&&+k<=view.qs[view.n].opts.length){stop();return earChoose(+k-1)}if(k==="e"){stop();return earSay()}return}
  if(n==="eardone"&&k==="q"){stop();return ear(view.si)}
  if(n==="level"&&k==="c"){const nx=nextMod(LEVELS[view.li]);if(nx){stop();openMod(nx)}return}
  if(m&&k==="r"){stop();return readRule(m)}
  if(m&&n!=="quiz"){
    if(k==="q"){stop();return quiz(m)}
    if(k==="a"&&m.items.length){stop();return learn(m,0)}
    if(k==="l"&&m.story){stop();return story(m,0)}
    if(k==="p"&&m.items.length&&["learn","story","done"].includes(n)){stop();return modPron(m)}
  }
  if(n==="learn"){
    if(k==="arrowright"){stop();step(1)}else if(k==="arrowleft"){stop();step(-1)}

  }else if(n==="quiz"){
    if(/^[1-4]$/.test(k)&&!view.answered&&+k<=view.qs[view.n].opts.length){stop();choose(+k-1)}
    else if(k==="e"){stop();readQ()}
  }else if(n==="done"&&k==="c"){const nx=m.level.mods[m.n];if(nx&&unlocked(nx)){stop();openMod(nx)}}
});

/* ---------- Voz: la mejor voz del equipo, frase por frase y con pausas ---------- */
const _autoPick=pick;

  const b=document.getElementById(lang==="en"?"venB":"vesB");if(b)b.textContent=(lang==="en"?"Cambiar voz en inglés · ahora: ":"Cambiar voz en español · ahora: ")+voiceName(lang)}
/* Divide un texto en frases (no corta dentro de «comillas» salvo al final de una frase en inglés). */
function sentences(text){const out=[];let cur="",q=false;const t=String(text);
  for(let i=0;i<t.length;i++){const c=t[i];cur+=c;if(c==="«")q=true;if(c==="»")q=false;
    const nx=t[i+1]||" ";

    else if(c==="»"&&/[.!?]/.test(t[i-1]||"")){out.push(cur.trim());cur=""}}
  if(cur.trim())out.push(cur.trim());return out.filter(Boolean)}
const PAUSE={sent:450,part:160,word:650};
let speakRefs=[];
/* parts: [[texto,"en"|"es",pausaOpcional]]. Habla en cola, con una pausa corta después de cada frase. */
function speakQ(parts,{onEnd,onPart,g,rate=1,enRate,esRate}={}){
  stopAll();const tok=playTok;speakRefs=[];
  const q=[];parts.forEach(([text,lang,pz],pi)=>{if(!text)return;const ss=sentences(text);
    ss.forEach((t,si)=>q.push({t,lang,pi,first:si===0,pz:si===ss.length-1&&pz!=null?pz:(/[.!?]»?$/.test(t)?PAUSE.sent:PAUSE.part)}))});
  let done=false;const end=()=>{if(done)return;done=true;if(tok===playTok&&onEnd)onEnd()};
  const go=k=>{if(tok!==playTok)return;if(k>=q.length)return end();const it=q[k];
    try{const u=new SpeechSynthesisUtterance(forSpeech(it.t.replace(/[«»]/g,"")));speakRefs.push(u);

  abortHear();if(!SR||micBlocked)return onFail("nomic");

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const inInput=e.target.matches("input,textarea");
  const k=e.key.toLowerCase(),n=view.name;
  const take=f=>{e.preventDefault();e.stopPropagation();f()};
  if(inInput){if(k==="escape"&&["order"].includes(n))take(()=>{abortHear();view.back()});return}
  if(n==="lock")return;
  if(k==="h"){e.preventDefault();e.stopPropagation();const t=HELP+HELP_PLUS;announce(t);return say([[t,"es"]],{force:true})}
  if(k==="j"&&!(n==="talk"&&view.state==="thinking"))return take(sunnyGo);
  if(n==="home"&&k==="o")return take(()=>orderHub());
  if(n==="home"&&k==="l")return take(()=>readHub());
  if(["explain","order","shadow","shadowq"].includes(n)&&k==="s")return take(toggleSpeed);
  if(n==="hub"&&k==="s"&&document.getElementById("spdB"))return take(toggleSpeed);
  if(n==="hub"&&view.keys&&view.keys[k])return take(view.keys[k]);
  if(n==="explain"){
    if(k==="escape")return take(()=>{stopAll();level(LEVELS.indexOf(view.m.level),view.m.n)});
    if(k===" "&&!e.target.matches("button"))return take(()=>explPlay(0));
    if(k==="arrowright")return take(()=>explStep(1));
    if(k==="arrowleft")return take(()=>explStep(-1));
    if(k==="r")return take(()=>explPlay(0));
    if(k==="p"&&view.m.items.length)return take(()=>modPron(view.m));
    return}
  if(n==="order"){
    if(k==="escape")return take(()=>{abortHear();view.back()});
    if(k===" "&&!e.target.matches("button"))return take(orderListen);
    if(k==="e")return take(()=>orderSay(true));
    if(k==="a")return take(orderHint);
    if(k==="arrowright")return take(()=>orderNext());
    return}
  if(n==="shadow"){
    if(k==="escape")return take(view.back);
    if(k===" "&&!e.target.matches("button,summary"))return take(()=>shAll());
    if(k==="g")return take(()=>shStart(view.mode==="shadow"?view.k:0));
    if(k==="arrowright")return take(()=>shMove(1));
    if(k==="arrowleft")return take(()=>shMove(-1));
    if(k==="q")return take(()=>shQuiz(0));
    return}
  if(n==="shadowq"){
    if(k==="escape")return take(view.back);
    if(/^[1-4]$/.test(k)&&+k<=view.opts.length)return take(()=>shAnswer(+k-1));
    if(k===" "&&!e.target.matches("button"))return take(shQListen);
    if(k==="e")return take(()=>shQSay(true));
    if(k==="l")return take(shQStory);
    return}
},true);

/* ---------- Código de acceso ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=c=>c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
async function openWith(code){
  try{
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(code)),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SEALED.salt),iterations:SEALED.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(SEALED.iv)},key,b64(SEALED.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }catch(e){return null}
}
/* Código personal (HADASH-000000): el puente lo valida y devuelve el código de la clase. */
async function unlockWith(code){
  try{const r=await fetch(window.SUNNY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"unlock",code:code.trim(),messages:[{role:"user",content:"unlock"}]})});
    if(!r.ok)return null;const d=await r.json();if(!d.classCode)return null;
    const lv=await openWith(d.classCode);return lv?{lv,cc:d.classCode}:null}catch(e){return null}
}
function boot(levels){
  LEVELS=levels;prep();maxStars=LEVELS.reduce((a,l)=>a+l.mods.length*3,0);drawStars();home();
}
function lock(msg){
  view={name:"lock"};
  app.innerHTML=`<h2>Escribe tu código de estudiante</h2>
  <p class="sub">Para entrar necesitas tu matrícula, por ejemplo HADASH-000000. Solo la escribes una vez en este equipo. Cada código funciona en un solo equipo.</p>
  <form class="panel" id="lockf" autocomplete="off">
    <label for="code" style="font-weight:700">Código de estudiante</label>
    <input id="code" type="text" autocapitalize="characters" spellcheck="false" style="font-size:1.4rem;padding:12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);text-transform:uppercase" aria-describedby="lockerr">
    <p class="feedback no" id="lockerr" role="alert">${msg||""}</p>
    <div class="row"><button class="btn primary" type="submit">${kb("Enter","Entrar")}</button></div>
  </form>`;
  const f=document.getElementById("lockf"),inp=document.getElementById("code"),er=document.getElementById("lockerr");
  inp.focus();
  f.onsubmit=async e=>{e.preventDefault();
    const code=inp.value;if(!code.trim())return;
    er.textContent="Revisando tu código...";er.className="feedback";
    const r=await HadashAccess.enter(code);
    const lv=r.ok&&r.data&&r.data.classCode?await openWith(r.data.classCode):null;
    if(!lv){const m=r.ok?HadashAccess.MSG.down:(HadashAccess.MSG[r.error]||HadashAccess.MSG.down);er.className="feedback no";er.textContent=m;say([[m,"es"]],{force:true});tone(false);inp.select();return}
    if(!sampleFn&&window.SUNNY_URL)sampleFn=webSample;
    tone(true);boot(lv);
    say([["¡Bienvenido! Elige tu nivel. Presiona 1, 2 o 3.","es"]]);
  };
  say([[msg||"Escribe tu código de estudiante y presiona Enter.","es"]]);
}
(async()=>{
  const saved=store.get("hadash-code",null),mine=store.get("hadash-sunny-code","");
  if(!mine){try{localStorage.removeItem("hadash-code")}catch(e){}
    return lock(saved?"Ahora cada estudiante entra con su propio código. Escribe tu matrícula.":"")}
  const lv=saved?await openWith(saved):null;
  if(!lv){const r=await HadashAccess.enter(mine);const lv2=r.ok&&r.data&&r.data.classCode?await openWith(r.data.classCode):null;
    if(lv2)return boot(lv2);
    return lock(r.ok||r.offline?HadashAccess.MSG.down:HadashAccess.MSG[r.error])}
  boot(lv);
  HadashAccess.verify().then(r=>{if(r.error)lock(HadashAccess.MSG[r.error])});
})();
</script>
