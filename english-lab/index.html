<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Lab · My English Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#14213D;--ink2:#465375;--bg:#F4F7FF;--card:#fff;--sun:#FFC400;--blue:#1673E6;--line:#DDE3F0;--ok:#1E9E45;--bad:#E53935}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:'Fredoka','Nunito',sans-serif;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
.top{background:linear-gradient(120deg,#0B4FB3,#1673E6 60%,#3BA0FF);color:#fff;padding:18px 0 26px;border-radius:0 0 28px 28px}
.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:var(--sun);display:flex;align-items:center;justify-content:center;font-size:26px}
.brand small{display:block;font-weight:700;letter-spacing:.14em;font-size:11px;opacity:.85}
.brand h1{font-size:26px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;background:rgba(255,255,255,.18);border-radius:20px;padding:6px 14px;font-weight:700;margin-bottom:12px}
.unit{background:var(--card);border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 2px 0 var(--line)}
.unit h2{font-size:20px;display:flex;gap:10px;align-items:center}
.un{background:var(--u,#1673E6);color:#fff;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px}
.tl{display:grid;gap:8px;margin-top:12px}
.ti{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px;color:var(--ink);text-decoration:none;font-weight:700}
.ti .ic{font-size:24px}.ti span{flex:1}.ti em{font-style:normal;font-size:12px;color:var(--ink2);font-weight:600;display:block}
.tag{font-size:11px;font-weight:800;border-radius:10px;padding:3px 9px;background:#E7F1FF;color:#0B4FB3;letter-spacing:.04em}
.tag.Conversation{background:#FFF0E0;color:#A84A00}.tag.Workbook{background:#E2F7E8;color:#126B2C}
.hero{margin-top:-14px;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 20px rgba(20,33,61,.08)}
.hero h2{font-size:26px;margin-top:6px}.hero .wh{color:var(--ink2);font-size:13px;font-weight:700}
.scene{background:#FFF8DC;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:15px}
.cast{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fredoka';font-size:22px;border:3px solid #fff;box-shadow:0 0 0 2px var(--c,#ccc)}
.av svg{width:56px;height:56px}
.who{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;gap:3px}
.player{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.play{background:var(--sun);color:var(--ink);font-family:'Fredoka';font-size:20px;border-radius:40px;padding:12px 24px;box-shadow:0 4px 0 #D9A400;display:flex;align-items:center;gap:8px}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 #D9A400}
.chipbtn{background:#EEF2FA;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.sec{background:var(--card);border-radius:22px;padding:18px;margin-top:16px}
.sec h3{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec h3 i{font-style:normal;background:var(--blue);color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.lines{display:grid;gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:8px 10px;transition:background .2s}
.ln .av{width:40px;height:40px;font-size:16px;flex:none}.ln .av svg{width:44px;height:44px}
.ln b{display:block;font-size:13px;color:var(--c)}
.ln.now{background:#FFF3C4}
.ln button{margin-left:auto;background:#EEF2FA;border-radius:50%;width:36px;height:36px;flex:none}
.hidden-text .ln p{filter:blur(6px);user-select:none}
.ttab{width:100%;border-collapse:separate;border-spacing:0 6px}
.ttab th{text-align:left;font-size:13px;color:var(--ink2);padding:0 6px}
.ttab td{padding:0 6px}
.ttab input{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.ttab input.ok{border-color:var(--ok);background:#EBF9EF}.ttab input.bad{border-color:var(--bad);background:#FDECEC}
.given{font-weight:800}
.check{background:var(--blue);color:#fff;border-radius:30px;padding:10px 22px;font-family:'Fredoka';font-size:17px;margin-top:10px}
.score{font-family:'Fredoka';font-size:18px;margin-left:12px}
.q{margin-top:12px}.q p{font-weight:800;margin:0 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:#EEF2FA;border-radius:14px;padding:10px 14px;font-weight:700}
.opt.ok{background:#D6F5DE;color:#126B2C}.opt.bad{background:#FDE0E0;color:#A11}
.rp{display:grid;gap:10px}
.rpbar{display:flex;gap:8px;flex-wrap:wrap}
.say{background:#FFF8DC;border:2px dashed #E0A800;border-radius:16px;padding:14px;font-size:19px;font-weight:700}
.mic{background:var(--bad);color:#fff;border-radius:30px;padding:10px 20px;font-family:'Fredoka';font-size:17px}
.fb{font-weight:800}
.stars{font-size:28px;letter-spacing:4px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.qrc{background:#fff;border-radius:16px;padding:14px;text-align:center;break-inside:avoid}
.qrc .code{display:flex;justify-content:center;margin:8px 0}
.qrc b{font-family:'Fredoka';font-size:16px}.qrc small{display:block;color:var(--ink2);font-size:12px}
.note{font-size:13px;color:var(--ink2);margin-top:10px}
.lv2{display:flex;flex-direction:column;gap:14px;margin-top:-14px}
.lvc2{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:22px;padding:18px 20px;color:var(--ink);text-decoration:none;box-shadow:0 6px 20px rgba(20,33,61,.08);border-left:8px solid var(--b);transition:transform .15s}
.lvc2:hover{transform:translateY(-3px)}.lvc2 .bd{flex:none;width:58px;height:58px;border-radius:18px;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:30px}
.lvc2 h2{margin:0;font-size:20px}.lvc2 h2 small{font-size:14px;color:var(--b)}.lvc2 p{margin:4px 0 0;font-size:14.5px;color:var(--ink2)}
.lvc2 .pill{margin-left:auto;flex:none;font-weight:800;font-size:13px;color:var(--b);background:color-mix(in srgb,var(--b) 12%,white);border-radius:20px;padding:6px 12px}
.lvc2.off{opacity:.55;cursor:default}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:-14px}
.bk{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:22px;padding:20px;color:var(--ink);text-decoration:none;box-shadow:0 6px 20px rgba(20,33,61,.08);border-top:6px solid var(--b);transition:transform .15s,box-shadow .15s}
.bk:hover,.bk:focus-visible{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,33,61,.14)}
.bk h2{font-size:21px;margin-top:10px}.bk p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
.bkic{font-size:34px;width:58px;height:58px;border-radius:16px;background:color-mix(in srgb,var(--b) 14%,#fff);display:flex;align-items:center;justify-content:center}
.bklv{position:absolute;top:20px;right:20px;background:var(--b);color:#fff;font-family:'Fredoka';border-radius:12px;padding:4px 12px;font-size:16px}
.bk .bkage{font-weight:800;color:var(--b);font-size:13px;margin-top:2px}
.bkmeta{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 14px}
.bkgo{margin-top:auto;align-self:flex-start;display:inline-block;background:var(--b);color:#fff;font-family:'Fredoka';border-radius:30px;padding:9px 18px;font-size:16px}
@media print{.top,.noprint{display:none}.qrgrid{grid-template-columns:repeat(3,1fr)}body{background:#fff}}
</style>
</head>

<script>
const DATA = {"tracks":[{"id":"u01-l","unit":1,"kind":"Listening","title":"First day of class","where":"Student’s Book · Unit 1 · Section 8","scene":"It’s the first day at Hadash Academy. Miss Ana asks three new students to introduce themselves.","lines":[["Miss Ana","Good morning, everyone! Welcome to Hadash Academy. Let’s introduce ourselves. You first, please."],["Nina","Hi! I’m Nina. I’m ten years old."],["Miss Ana","Nice to meet you, Nina. Where are you from?"],["Nina","I’m from Santiago."],["Miss Ana","Thank you. And what’s your name?"],["Omar","Hello, I’m Omar. I’m ten, too. I’m from La Romana."],["Miss Ana","Welcome, Omar! And you?"],["Sofia","Hi! My name’s Sofia. I’m nine, and I’m from Puerto Plata. Nice to meet you!"],["Miss Ana","Nice to meet you, too, Sofia. Welcome, everyone!"]],"task":{"prompt":"Listen. Write each student’s age and city.","cols":["Name","Age","From"],"rows":[["Nina","10","Santiago"],["Omar","10","La Romana"],["Sofia","9","Puerto Plata"]]},"quiz":[["Who is the teacher?",["Nina","Miss Ana","Sofia"],1],["Who is nine years old?",["Sofia","Omar","Nina"],0],["Where is Omar from?",["Santiago","Puerto Plata","La Romana"],2]]},{"id":"u01-c","unit":1,"kind":"Conversation","title":"Talk time: Hello, World!","where":"Student’s Book · Unit 1 · Section 3","scene":"It’s the first day of English class at Hadash Academy.","lines":[["Miss Ana","Good morning, class! I’m Miss Ana, your teacher."],["Maya","Good morning, Miss Ana!"],["Leo","Hi! I’m Leo. What’s your name?"],["Maya","My name’s Maya. Nice to meet you, Leo."],["Leo","Nice to meet you, too! How old are you?"],["Maya","I’m nine. And you?"],["Leo","I’m ten."]],"task":null,"quiz":null},{"id":"wb01-1","unit":1,"kind":"Workbook","title":"At the school gate","where":"Workbook · Unit 1 · Exercise 11 · Track 1.1","scene":"Look at the picture of Hadash Academy. Listen and label the picture.","lines":[["Miss Ana","Hello, everyone! I’m Miss Ana, your teacher. Look at our school. It’s Hadash Academy!"],["Miss Ana","And look at the flag. It’s the flag of the Dominican Republic."],["Leo","Hi! I’m Leo. I have a blue backpack. I’m saying hello to Maya."],["Maya","Hello, Leo! I’m Maya. I have a pink backpack."],["Omar","And I’m Omar. I’m next to the gate. Nice to meet you!"]],"task":{"prompt":"Write the words: teacher · school · flag · Leo · Maya · Omar.","cols":["Number","Label"],"rows":[["1","teacher"],["2","school"],["3","Leo"],["4","Maya"],["5","Omar"],["6","flag"]]},"quiz":[["What color is Leo’s backpack?",["pink","blue","green"],1],["Who is next to the gate?",["Omar","Maya","Miss Ana"],0],["What is the name of the school?",["Santo Domingo School","Hadash Academy","La Romana Academy"],1]]},{"id":"u02-l","unit":2,"kind":"Listening","title":"Spell the names","where":"Student’s Book · Unit 2 · Section 8","scene":"Miss Ana writes the names of three new students on the board.","lines":[["Miss Ana","Good morning! I’m writing your names on the board. What’s your name, please?"],["Sara","My name’s Sara."],["Miss Ana","How do you spell it?"],["Sara","S-A-R-A.","S. A. R. A."],["Miss Ana","Thank you, Sara. And you?"],["Tomás","I’m Tomás. T-O-M-A-S.","I’m Tomás. T. O. M. A. S."],["Miss Ana","Great! And what’s your name?"],["Kevin","Hi! I’m Kevin. K-E-V-I-N.","Hi! I’m Kevin. K. E. V. I. N."],["Miss Ana","Perfect. Sara, Tomás and Kevin. Welcome!"]],"task":{"prompt":"Write each name and its first letter.","cols":["Student","Name","First letter"],"rows":[["Student 1","Sara","S"],["Student 2","Tomás","T"],["Student 3","Kevin","K"]]},"quiz":[["How do you spell Kevin?",["K-E-V-I-N","K-E-B-I-N","C-E-V-I-N"],0],["Which name starts with T?",["Sara","Tomás","Kevin"],1],["How many students spell their names?",["two","three","four"],1]]},{"id":"u02-c","unit":2,"kind":"Conversation","title":"Talk time: Letters and Sounds","where":"Student’s Book · Unit 2 · Section 3","scene":"Nina meets a new student.","lines":[["Nina","Hi! What’s your name?"],["Omar","My name’s Omar."],["Nina","How do you spell it?"],["Omar","O-M-A-R."],["Nina","Cool! My name’s Nina. N-I-N-A."],["Omar","Nina starts with N. N is for nose!"]],"task":null,"quiz":null},{"id":"u03-l","unit":3,"kind":"Listening","title":"Phone numbers","where":"Student’s Book · Unit 3 · Section 8","scene":"Three students make a class phone list.","lines":[["Miss Ana","Let’s make a class phone list. Daniel, how old are you?"],["Daniel","I’m eleven. My phone number is 809-555-0147.","I’m eleven. My phone number is eight oh nine, five five five, oh one four seven."],["Miss Ana","Thank you. Laura?"],["Laura","I’m nine. My number is 829-555-0182.","I’m nine. My number is eight two nine, five five five, oh one eight two."],["Miss Ana","And you, Pedro?"],["Pedro","My name’s Pedro. I’m ten. My phone number is 849-555-0136.","My name’s Pedro. I’m ten. My phone number is eight four nine, five five five, oh one three six."],["Miss Ana","Great! Now we have a phone list."]],"task":{"prompt":"Write each student’s age and phone number.","cols":["Name","Age","Phone number"],"rows":[["Daniel","11","809-555-0147"],["Laura","9","829-555-0182"],["Pedro","10","849-555-0136"]]},"quiz":[["How old is Daniel?",["nine","ten","eleven"],2],["Whose number starts with 829?",["Laura","Pedro","Daniel"],0],["How old is Pedro?",["ten","nine","eleven"],0]]},{"id":"u03-c","unit":3,"kind":"Conversation","title":"Talk time: Numbers and Personal Information","where":"Student’s Book · Unit 3 · Section 3","scene":"Miss Ana counts the books with the class.","lines":[["Miss Ana","How many books are there?"],["Nina","One, two, three… There are eighteen!"],["Miss Ana","Great! And how many pencils?"],["Leo","There are ten pencils."],["Miss Ana","Thank you, Leo. How old are you, Nina?"],["Nina","I’m ten."]],"task":null,"quiz":null},{"id":"u04-l","unit":4,"kind":"Listening","title":"Color the picture","where":"Student’s Book · Unit 4 · Section 8","scene":"Miss Ana shows Omar her picture of shapes.","lines":[["Miss Ana","Look at my picture, Omar. Can you see the star?"],["Omar","Yes! It’s a big star. What color is it?"],["Miss Ana","The big star is yellow."],["Omar","And the circle?"],["Miss Ana","The circle is small. It’s red."],["Omar","Is the square blue?"],["Miss Ana","Yes, it is. It’s a big blue square!"],["Omar","I like your picture, Miss Ana!"]],"task":{"prompt":"Write the color and the size of each shape.","cols":["Shape","Color","Big or small?"],"rows":[["star","yellow","big"],["circle","red","small"],["square","blue","big"]]},"quiz":[["What color is the star?",["red","yellow","blue"],1],["Is the circle big or small?",["big","small","very big"],1],["What color is the square?",["blue","green","yellow"],0]]},{"id":"u04-c","unit":4,"kind":"Conversation","title":"Talk time: Colors, Shapes and Descriptions","where":"Student’s Book · Unit 4 · Section 3","scene":"Maya and Omar make a poster.","lines":[["Maya","Look! What color is the star?"],["Omar","It’s yellow."],["Maya","Is the circle blue?"],["Omar","No, it isn’t. It’s red."],["Maya","What color are the triangles?"],["Omar","They’re green. They’re big triangles!"]],"task":null,"quiz":null},{"id":"u05-l","unit":5,"kind":"Listening","title":"Lost and found","where":"Student’s Book · Unit 5 · Section 8","scene":"After class, Miss Ana finds some things on the floor.","lines":[["Miss Ana","Whose pencil is this?"],["Maya","It’s my pencil! It’s blue."],["Miss Ana","Here you are, Maya. And this yellow ruler?"],["Omar","That’s my ruler. Thank you, Miss Ana!"],["Miss Ana","You’re welcome. Is this green backpack yours, Leo?"],["Leo","Yes, it is. Thank you!"],["Miss Ana","Remember, put your things away, please."]],"task":{"prompt":"Who has each thing? Write the name and the color.","cols":["Thing","Whose?","Color"],"rows":[["pencil","Maya","blue"],["ruler","Omar","yellow"],["backpack","Leo","green"]]},"quiz":[["Whose ruler is it?",["Leo’s","Omar’s","Maya’s"],1],["What color is Maya’s pencil?",["blue","yellow","green"],0],["What does Miss Ana say at the end?",["Sit down, please.","Put your things away, please.","Open your books."],1]]},{"id":"u05-c","unit":5,"kind":"Conversation","title":"Talk time: My Classroom","where":"Student’s Book · Unit 5 · Section 3","scene":"It’s English class.","lines":[["Miss Ana","Open your books, please. Look at page five."],["Omar","Excuse me, Miss Ana. Is this your pencil?"],["Miss Ana","No, it isn’t. It’s Maya’s."],["Maya","Yes, that’s my pencil! Thank you, Omar."],["Omar","You’re welcome. Are these your crayons, too?"],["Maya","No, those are Nina’s."]],"task":null,"quiz":null},{"id":"u06-l","unit":6,"kind":"Listening","title":"Family photos","where":"Student’s Book · Unit 6 · Section 8","scene":"Leo shows Nina photos of his family.","lines":[["Nina","Leo, who is this in photo one?"],["Leo","That’s my grandmother. Her name is Lucía."],["Nina","She looks very kind! And photo two?"],["Leo","That’s my cousin. His name is Mateo. He’s eleven."],["Nina","Who is the woman in photo three?"],["Leo","She’s my aunt. Her name is Carmen. She’s a teacher."],["Nina","You have a big family, Leo!"]],"task":{"prompt":"Who is in each photo? Write the person and the name.","cols":["Photo","Who?","Name"],"rows":[["Photo 1","grandmother","Lucía"],["Photo 2","cousin","Mateo"],["Photo 3","aunt","Carmen"]]},"quiz":[["Who is Lucía?",["Leo’s aunt","Leo’s grandmother","Leo’s cousin"],1],["How old is Mateo?",["ten","eleven","twelve"],1],["What is Carmen’s job?",["doctor","teacher","nurse"],1]]},{"id":"u06-c","unit":6,"kind":"Conversation","title":"Talk time: My Family and Friends","where":"Student’s Book · Unit 6 · Section 3","scene":"Nina looks at Leo’s family photo.","lines":[["Nina","Who is she?"],["Leo","She’s my sister."],["Nina","What’s her name?"],["Leo","Her name is Emma. She’s six."],["Nina","And who is he?"],["Leo","He’s my grandpa, Joe. He’s funny, and he likes music."]],"task":null,"quiz":null},{"id":"u07-l","unit":7,"kind":"Listening","title":"Draw a monster","where":"Student’s Book · Unit 7 · Section 4","scene":"Nina and Leo are drawing funny monsters in art class.","lines":[["Nina","Look, Leo! This is my monster. Can you guess what it looks like?"],["Leo","Has your monster got big ears?"],["Nina","Yes, it has. It has got very big ears!"],["Leo","Has it got two eyes?"],["Nina","No, it has got three. And it has got long green hair."],["Leo","Ha ha! My monster has got four arms and a small nose."],["Nina","Four arms? Wow! Is it tall?"],["Leo","Yes, it is very tall. And it has got short legs."]],"task":{"prompt":"Complete the monster descriptions.","cols":["Monster","Ears / eyes","Hair / arms"],"rows":[["Nina’s monster","three eyes","green hair"],["Leo’s monster","small nose","four arms"]]},"quiz":[["How many eyes has Nina’s monster got?",["two","three","four"],1],["What color is the hair?",["green","blue","black"],0],["Is Leo’s monster tall?",["No, it is short.","Yes, it is very tall.","It is small."],1]]},{"id":"u07-c","unit":7,"kind":"Conversation","title":"Talk time: My Body and Appearance","where":"Student’s Book · Unit 7 · Section 3","scene":"Nina and Leo are drawing monsters in art class.","lines":[["Nina","Look at my monster! It’s got three eyes."],["Leo","Wow! Has it got big ears?"],["Nina","Yes, it has. And it’s got long green hair."],["Leo","My monster has got four arms and small feet."],["Nina","Is it tall?"],["Leo","Yes, it is. It’s very tall!"]],"task":null,"quiz":null},{"id":"u08-l","unit":8,"kind":"Listening","title":"Weather report","where":"Student’s Book · Unit 8 · Section 4","scene":"Maya and her mom get ready for school in the morning.","lines":[["Mom","Good morning, Maya! Look out the window."],["Maya","What is the weather like today?"],["Mom","It is windy. And it is cold, too."],["Maya","Oh no! What are you wearing, Mom?"],["Mom","I am wearing a jacket and a scarf."],["Maya","Then I am wearing my jacket, too. And my boots!"],["Mom","Good idea. Tomorrow it is sunny and hot."],["Maya","Great! Tomorrow I can wear my T-shirt and shorts."]],"task":{"prompt":"Write the weather and the clothes.","cols":["Day","Weather","Clothes"],"rows":[["Today","windy","jacket"],["Tomorrow","sunny","T-shirt"]]},"quiz":[["What is the weather like today?",["sunny","windy","rainy"],1],["What is Mom wearing?",["a jacket and a scarf","a T-shirt","a dress"],0],["What is the weather tomorrow?",["cold and rainy","windy","sunny and hot"],2]]},{"id":"u08-c","unit":8,"kind":"Conversation","title":"Talk time: Clothes and Weather","where":"Student’s Book · Unit 8 · Section 3","scene":"Maya and Omar are leaving school.","lines":[["Omar","Look outside! What’s the weather like?"],["Maya","It’s rainy and windy."],["Omar","Oh no! I’m wearing shorts and a T-shirt."],["Maya","I’m wearing my jacket. Here, take my umbrella."],["Omar","Thanks, Maya! You’re a good friend."],["Maya","No problem. Tomorrow it’s sunny!"]],"task":null,"quiz":null},{"id":"u09-l","unit":9,"kind":"Listening","title":"Animal quiz","where":"Student’s Book · Unit 9 · Section 4","scene":"Omar and Miss Ana play an animal quiz game in class.","lines":[["Miss Ana","Omar, let’s play the animal quiz! Ready?"],["Omar","Ready! Can a duck swim?"],["Miss Ana","Yes, it can. Ducks swim in ponds."],["Omar","Can a horse fly?"],["Miss Ana","No, it cannot. Horses run very fast."],["Omar","Can a monkey climb?"],["Miss Ana","Yes, it can! Monkeys climb trees. Now my question. Can a fish walk?"],["Omar","No, it cannot! Fish swim."]],"task":{"prompt":"Can or cannot? Write the answer.","cols":["Animal","Action","Can / cannot"],"rows":[["duck","swim","can"],["horse","fly","cannot"],["monkey","climb","can"],["fish","walk","cannot"]]},"quiz":[["What can a horse do?",["fly","run very fast","swim in ponds"],1],["Where do monkeys climb?",["trees","houses","ponds"],0],["Who asks the last question?",["Omar","Miss Ana","Leo"],1]]},{"id":"u09-c","unit":9,"kind":"Conversation","title":"Talk time: Pets and Wild Animals","where":"Student’s Book · Unit 9 · Section 3","scene":"Omar and Leo visit the zoo.","lines":[["Omar","Look! A monkey! Can it climb?"],["Leo","Yes, it can. It climbs very fast."],["Omar","What about the elephant? Can it jump?"],["Leo","No, it can’t. But it can swim!"],["Omar","Really? And the snake?"],["Leo","It can’t walk, but it can move very fast."]],"task":null,"quiz":null},{"id":"u10-l","unit":10,"kind":"Listening","title":"Lunch time","where":"Student’s Book · Unit 10 · Section 4","scene":"Leo and Nina talk about food in the school cafeteria.","lines":[["Nina","Mmm, rice and beans! Do you like rice?"],["Leo","Yes, I do. I love rice and chicken."],["Nina","Does your sister like milk?"],["Leo","No, she does not. She likes orange juice."],["Nina","I like milk. I don’t like coffee."],["Leo","Me neither! Do you like bananas?"],["Nina","Yes, I do. Bananas are my favorite fruit."]],"task":{"prompt":"Who likes it? Write yes or no.","cols":["Food","Leo / his sister","Yes / No"],"rows":[["rice","Leo","yes"],["milk","sister","no"],["orange juice","sister","yes"]]},"quiz":[["What does Leo love?",["rice and chicken","milk","coffee"],0],["What does Leo’s sister like?",["milk","orange juice","coffee"],1],["What is Nina’s favorite fruit?",["apples","mangoes","bananas"],2]]},{"id":"u10-c","unit":10,"kind":"Conversation","title":"Talk time: Food and Drinks","where":"Student’s Book · Unit 10 · Section 3","scene":"Leo and Nina are in the school cafeteria.","lines":[["Nina","Mmm, rice and beans! Do you like rice and beans?"],["Leo","Yes, I do! I love them."],["Nina","Does your brother like chicken?"],["Leo","No, he doesn’t. He likes fish."],["Nina","I don’t like fish. I like mangoes!"],["Leo","Me too. Mangoes are delicious!"]],"task":null,"quiz":null},{"id":"u11-l","unit":11,"kind":"Listening","title":"At the market","where":"Student’s Book · Unit 11 · Section 4","scene":"Nina is shopping at the market with a list.","lines":[["Vendor","Good morning! Can I help you?"],["Nina","Yes, please. How much is the water?"],["Vendor","It is fifty pesos."],["Nina","OK. Do you have any apples?"],["Vendor","Yes, I do. They are twenty pesos each."],["Nina","Six apples, please. How many bananas can I get for thirty pesos?"],["Vendor","Three bananas."],["Nina","Great! Here you are. Thank you!"]],"task":{"prompt":"Write the price and the number.","cols":["Item","How many?","Price (pesos)"],"rows":[["water","1","50"],["apples","6","20"],["bananas","3","30"]]},"quiz":[["How much is the water?",["twenty pesos","fifty pesos","thirty pesos"],1],["How many apples does Nina buy?",["three","six","five"],1],["Where is Nina?",["at school","at home","at the market"],2]]},{"id":"u11-c","unit":11,"kind":"Conversation","title":"Talk time: At the Market","where":"Student’s Book · Unit 11 · Section 3","scene":"Nina is at the market with her mom.","lines":[["Nina","Excuse me. How much are the bananas?"],["Seller","They’re ten pesos each."],["Nina","Can I have six bananas, please?"],["Seller","Sure. Anything else?"],["Nina","Do you have any eggs?"],["Seller","Yes, I do. Here you are. That’s ninety pesos."]],"task":null,"quiz":null},{"id":"u12-l","unit":12,"kind":"Listening","title":"My new room","where":"Student’s Book · Unit 12 · Section 4","scene":"Maya is showing her new bedroom to her friend Nina on a video call.","lines":[["Nina","Hi, Maya! Show me your new room!"],["Maya","OK! Look. This is my room."],["Nina","Is there a desk in your room?"],["Maya","Yes, there is. It is next to the window."],["Nina","Are there two beds?"],["Maya","No, there is one. But there are two pillows!"],["Nina","Is there a lamp?"],["Maya","Yes, there is a pink lamp. And there are three posters on the wall."]],"task":{"prompt":"How many? Write the number.","cols":["Thing","How many?","Where?"],"rows":[["desk","1","next to the window"],["bed","1","room"],["posters","3","wall"]]},"quiz":[["Where is the desk?",["next to the window","under the bed","on the wall"],0],["How many beds are there?",["two","one","three"],1],["What color is the lamp?",["blue","pink","yellow"],1]]},{"id":"u12-c","unit":12,"kind":"Conversation","title":"Talk time: My Home","where":"Student’s Book · Unit 12 · Section 3","scene":"Maya shows Omar her new apartment.","lines":[["Maya","Welcome to my new home!"],["Omar","Wow! Is there a balcony?"],["Maya","Yes, there is. And there are two bedrooms."],["Omar","Is there a garden?"],["Maya","No, there isn’t. But there are lots of plants."],["Omar","I like it. It’s very nice!"]],"task":null,"quiz":null},{"id":"u13-l","unit":13,"kind":"Listening","title":"Where are my things?","where":"Student’s Book · Unit 13 · Section 4","scene":"Leo is late for school and can’t find his things.","lines":[["Leo","Mom! Where is the pencil? I need it for school."],["Mom","It is under the book, Leo."],["Leo","Thanks! Are the keys on the table?"],["Mom","No, they are beside the lamp."],["Leo","And where is my backpack?"],["Mom","It is behind the door."],["Leo","Got it! Bye, Mom!"],["Mom","Wait! Your lunch is in the kitchen!"]],"task":{"prompt":"Where is it? Write the place.","cols":["Thing","Where?"],"rows":[["pencil","under the book"],["keys","beside the lamp"],["backpack","behind the door"],["lunch","in the kitchen"]]},"quiz":[["Where is the pencil?",["on the book","under the book","in the book"],1],["Where is the backpack?",["behind the door","on the table","in the kitchen"],0],["What does Leo forget?",["his keys","his pencil","his lunch"],2]]},{"id":"u13-c","unit":13,"kind":"Conversation","title":"Talk time: Where Is It?","where":"Student’s Book · Unit 13 · Section 3","scene":"Leo is looking for his things before school.","lines":[["Leo","Mom, where is my pencil case?"],["Mom","It’s on the table, next to the lamp."],["Leo","Thanks! And where are my shoes?"],["Mom","They’re under your bed."],["Leo","Got them! Where is my backpack?"],["Mom","Look! It’s behind the door."]],"task":null,"quiz":null},{"id":"u14-l","unit":14,"kind":"Listening","title":"What time is it?","where":"Student’s Book · Unit 14 · Section 4","scene":"Omar and Miss Ana talk about the class schedule.","lines":[["Omar","Miss Ana, what time is it?"],["Miss Ana","It is half past seven."],["Omar","When is English class?"],["Miss Ana","On Tuesday and Thursday, at eight o’clock."],["Omar","And when is the school trip?"],["Miss Ana","In March. On March tenth."],["Omar","Cool! My birthday is in March, too!"]],"task":{"prompt":"Write the day, time or month.","cols":["Event","When?"],"rows":[["now","half past seven"],["English class","Tuesday"],["school trip","March"]]},"quiz":[["What time is it now?",["seven o’clock","half past seven","eight o’clock"],1],["What time is English class?",["at eight o’clock","at nine o’clock","at seven"],0],["When is Omar’s birthday?",["in May","in March","in June"],1]]},{"id":"u14-c","unit":14,"kind":"Conversation","title":"Talk time: Days, Months and Time","where":"Student’s Book · Unit 14 · Section 3","scene":"Omar asks Miss Ana about the school week.","lines":[["Omar","Excuse me, Miss Ana. What time is it?"],["Miss Ana","It’s quarter past eight."],["Omar","When is our art class?"],["Miss Ana","It’s on Friday, at ten o’clock."],["Omar","And when is the school party?"],["Miss Ana","It’s in December. Don’t worry!"]],"task":null,"quiz":null},{"id":"u15-l","unit":15,"kind":"Listening","title":"A day with Nina","where":"Student’s Book · Unit 15 · Section 4","scene":"Leo interviews Nina for the school newspaper.","lines":[["Leo","Nina, what time do you get up?"],["Nina","I get up at seven."],["Leo","What do you have for breakfast?"],["Nina","I have bread and juice. Then I go to school at half past seven."],["Leo","What does your brother do after school?"],["Nina","He plays football."],["Leo","And what does Nina do after dinner?"],["Nina","She reads! I love books."]],"task":{"prompt":"Complete Nina’s routine.","cols":["Time of day","Activity"],"rows":[["7:00","get up"],["breakfast","bread and juice"],["after dinner","reads"]]},"quiz":[["What time does Nina get up?",["at six","at seven","at eight"],1],["What does her brother do after school?",["He reads.","He plays football.","He sleeps."],1],["What does Nina do after dinner?",["She reads.","She watches TV.","She dances."],0]]},{"id":"u15-c","unit":15,"kind":"Conversation","title":"Talk time: My Daily Routine","where":"Student’s Book · Unit 15 · Section 3","scene":"Nina and Leo compare their mornings.","lines":[["Leo","What time do you get up, Nina?"],["Nina","I get up at six. Then I take a shower."],["Leo","Wow, early! I get up at half past six."],["Nina","What does your sister do in the morning?"],["Leo","She brushes her teeth and eats breakfast."],["Nina","My brother sleeps until seven!"]],"task":null,"quiz":null},{"id":"u16-l","unit":16,"kind":"Listening","title":"How often?","where":"Student’s Book · Unit 16 · Section 4","scene":"Leo and Maya do a class survey about habits.","lines":[["Maya","Leo, it is survey time! Do you always eat breakfast?"],["Leo","Yes, I do. I always eat eggs."],["Maya","Do you sometimes play video games?"],["Leo","Yes, sometimes. On Saturdays."],["Maya","Does Leo play on rainy days?"],["Leo","No, he never does! I never play outside when it rains."],["Maya","Do you usually do your homework?"],["Leo","Yes, I usually do it after lunch."]],"task":{"prompt":"Write always, usually, sometimes or never.","cols":["Activity","How often?"],"rows":[["eat breakfast","always"],["play video games","sometimes"],["play outside on rainy days","never"],["do homework","usually"]]},"quiz":[["What does Leo eat for breakfast?",["eggs","bread","rice"],0],["When does Leo play video games?",["on Mondays","on Saturdays","every day"],1],["When does he do his homework?",["after lunch","after dinner","in the morning"],0]]},{"id":"u16-c","unit":16,"kind":"Conversation","title":"Talk time: Questions and Frequency","where":"Student’s Book · Unit 16 · Section 3","scene":"Maya interviews Leo for a class survey.","lines":[["Maya","Leo, do you always eat breakfast?"],["Leo","Yes, I do. I always eat eggs."],["Maya","Do you often watch TV?"],["Leo","No, I don’t. I sometimes watch TV on Sundays."],["Maya","Does your sister play soccer?"],["Leo","No, she never plays soccer. She dances!"]],"task":null,"quiz":null},{"id":"u17-l","unit":17,"kind":"Listening","title":"Talent show","where":"Student’s Book · Unit 17 · Section 4","scene":"Maya and Omar plan the school talent show.","lines":[["Maya","Omar, let’s do the talent show! Can you play the guitar?"],["Omar","No, I cannot, but I can sing."],["Maya","Great! I can play the piano."],["Omar","Do you like dancing?"],["Maya","Yes, I do! I love dancing."],["Omar","Can Leo dance?"],["Maya","No, he cannot. But he can tell jokes!"],["Omar","Perfect! Singing, piano, dancing and jokes!"]],"task":{"prompt":"What can they do? Write it.","cols":["Name","Can","Cannot"],"rows":[["Omar","sing","play the guitar"],["Leo","tell jokes","dance"]]},"quiz":[["What can Omar do?",["play the guitar","sing","dance"],1],["What does Maya love?",["dancing","singing","reading"],0],["What can Leo do?",["play the piano","tell jokes","sing"],1]]},{"id":"u17-c","unit":17,"kind":"Conversation","title":"Talk time: Fun and Free Time","where":"Student’s Book · Unit 17 · Section 3","scene":"Maya and Omar talk about the school talent show.","lines":[["Maya","Omar, can you play the guitar?"],["Omar","No, I can’t. But I can sing!"],["Maya","Great! Do you like dancing?"],["Omar","Yes, I love dancing merengue."],["Maya","Can you dance with me at the talent show?"],["Omar","Sure! Let’s practice after school."]],"task":null,"quiz":null},{"id":"u18-l","unit":18,"kind":"Listening","title":"Phone call","where":"Student’s Book · Unit 18 · Section 4","scene":"Maya calls her friend Nina on Saturday afternoon.","lines":[["Nina","Hello?"],["Maya","Hi, Nina! It’s Maya. What are you doing?"],["Nina","I am drawing. What about you?"],["Maya","I am helping my dad. He is washing the car."],["Nina","Is your mother cooking?"],["Maya","No, she is reading. And my brother is sleeping!"],["Nina","Ha ha! Do you want to come and draw with me?"],["Maya","Yes! See you soon!"]],"task":{"prompt":"What is each person doing?","cols":["Person","Doing"],"rows":[["Nina","drawing"],["Maya’s dad","washing the car"],["Maya’s mother","reading"],["Maya’s brother","sleeping"]]},"quiz":[["What is Nina doing?",["reading","drawing","cooking"],1],["Is Maya’s mother cooking?",["Yes, she is.","No, she is reading.","No, she is sleeping."],1],["Who is sleeping?",["Maya’s brother","Maya’s dad","Nina"],0]]},{"id":"u18-c","unit":18,"kind":"Conversation","title":"Talk time: What Are You Doing?","where":"Student’s Book · Unit 18 · Section 3","scene":"Maya calls Nina on Saturday afternoon.","lines":[["Maya","Hi, Nina! What are you doing?"],["Nina","I’m drawing a picture. And you?"],["Maya","I’m helping my mom. She’s cooking dinner."],["Nina","Is your brother helping, too?"],["Maya","No, he isn’t. He’s sleeping on the sofa!"],["Nina","Ha ha! Typical brother!"]],"task":null,"quiz":null},{"id":"u19-l","unit":19,"kind":"Listening","title":"Directions in town","where":"Student’s Book · Unit 19 · Section 4","scene":"Omar is in town and needs to find the library.","lines":[["Omar","Excuse me, where is the library?"],["Woman","Go straight and turn right. It is next to the bakery."],["Omar","Next to the bakery. Thank you! Is there a park near here?"],["Woman","Yes, there is. It is across from the hospital."],["Omar","And where is the bank?"],["Woman","It is between the supermarket and the post office."],["Omar","Thank you very much!"],["Woman","You’re welcome. Have a nice day!"]],"task":{"prompt":"Where is it? Write the place.","cols":["Place","Where?"],"rows":[["library","next to the bakery"],["park","across from the hospital"],["bank","between the supermarket and the post office"]]},"quiz":[["How do you get to the library?",["Turn left.","Go straight and turn right.","Go back."],1],["Where is the park?",["across from the hospital","next to the bank","behind the school"],0],["Who is Omar talking to?",["his teacher","a woman","his mom"],1]]},{"id":"u19-c","unit":19,"kind":"Conversation","title":"Talk time: Places in My Town","where":"Student’s Book · Unit 19 · Section 3","scene":"Omar is lost in town. He asks a woman for help.","lines":[["Omar","Excuse me. Where is the library?"],["Woman","Go straight and turn left at the bank."],["Omar","Turn left at the bank. Is it far?"],["Woman","No, it isn’t. It’s next to the bakery."],["Omar","Thank you very much!"],["Woman","You’re welcome. Have a nice day!"]],"task":null,"quiz":null},{"id":"u20-l","unit":20,"kind":"Listening","title":"Family jobs","where":"Student’s Book · Unit 20 · Section 4","scene":"Nina and Leo talk about their families’ jobs for a class project.","lines":[["Leo","Nina, what does your aunt do?"],["Nina","She is a nurse."],["Leo","Where does she work?"],["Nina","In a clinic. She helps sick people."],["Leo","My uncle is a firefighter. He works at the fire station."],["Nina","Wow! What does your mom do?"],["Leo","She is a teacher. She works at a school."],["Nina","My dad is a driver. He drives a bus."]],"task":{"prompt":"Write the job and the place.","cols":["Person","Job","Workplace"],"rows":[["Nina’s aunt","nurse","clinic"],["Leo’s uncle","firefighter","fire station"],["Leo’s mom","teacher","school"]]},"quiz":[["What does Nina’s aunt do?",["She is a doctor.","She is a nurse.","She is a teacher."],1],["Where does Leo’s uncle work?",["at a clinic","at a school","at the fire station"],2],["What does Nina’s dad drive?",["a bus","a taxi","a truck"],0]]},{"id":"u20-c","unit":20,"kind":"Conversation","title":"Talk time: Jobs and Community Helpers","where":"Student’s Book · Unit 20 · Section 3","scene":"Nina and Leo talk about jobs for a class project.","lines":[["Leo","Nina, what does your aunt do?"],["Nina","She’s a doctor. She works in a clinic."],["Leo","Cool! My uncle is a firefighter."],["Nina","Where does he work?"],["Leo","At the fire station. What do you want to be?"],["Nina","I want to be a doctor, like my aunt!"]],"task":null,"quiz":null},{"id":"u21-l","unit":21,"kind":"Listening","title":"At the nurse’s office","where":"Student’s Book · Unit 21 · Section 4","scene":"Leo doesn’t feel well and visits the school nurse.","lines":[["Nurse","Hello, Leo. How do you feel?"],["Leo","I feel tired. And I have got a headache."],["Nurse","Oh, I’m sorry. Would you like some water?"],["Leo","Yes, please."],["Nurse","Here you are. Sit down and rest for ten minutes."],["Leo","Thank you. I feel a little better."],["Nurse","Good. Go to bed early tonight, OK?"],["Leo","OK. Thank you!"]],"task":{"prompt":"Complete the notes.","cols":["Question","Answer"],"rows":[["How does Leo feel?","tired"],["What has he got?","a headache"],["How many minutes does he rest?","10"]]},"quiz":[["How does Leo feel?",["happy","tired","hungry"],1],["What does the nurse give Leo?",["water","juice","medicine"],0],["What is the nurse’s advice?",["Play football.","Go to bed early.","Eat candy."],1]]},{"id":"u21-c","unit":21,"kind":"Conversation","title":"Talk time: Feelings, Health and Advice","where":"Student’s Book · Unit 21 · Section 3","scene":"Leo looks sad at break time. Maya asks him.","lines":[["Maya","Leo, are you OK? How do you feel?"],["Leo","I feel tired, and I have a headache."],["Maya","Oh no! Would you like some water?"],["Leo","Yes, please. Thank you."],["Maya","Sit down and rest a little."],["Leo","Thanks, Maya. I feel better now."]],"task":null,"quiz":null},{"id":"u22-l","unit":22,"kind":"Listening","title":"Last weekend","where":"Student’s Book · Unit 22 · Section 4","scene":"Maya and Omar talk on Monday morning.","lines":[["Omar","Hi, Maya! What did you do yesterday?"],["Maya","I visited my grandmother."],["Omar","Did you watch TV?"],["Maya","Yes, I did. We watched a movie together."],["Omar","Nice! I played baseball on Saturday."],["Maya","Did your team win?"],["Omar","Yes, it did! Then we went to the beach."],["Maya","Wow! You had a great weekend."]],"task":{"prompt":"What did they do? Write it.","cols":["Name","Activity"],"rows":[["Maya","visited her grandmother"],["Maya","watched a movie"],["Omar","played baseball"],["Omar","went to the beach"]]},"quiz":[["Who did Maya visit?",["her aunt","her grandmother","her friend"],1],["What did Omar play?",["football","basketball","baseball"],2],["Did Omar’s team win?",["Yes, it did.","No, it didn’t.","We don’t know."],0]]},{"id":"u22-c","unit":22,"kind":"Conversation","title":"Talk time: Yesterday and Last Weekend","where":"Student’s Book · Unit 22 · Section 3","scene":"Omar and Maya meet on Monday morning.","lines":[["Omar","Hi, Maya! What did you do last weekend?"],["Maya","I visited my grandma in Santiago."],["Omar","Cool! Did you go by bus?"],["Maya","Yes, I did. What about you?"],["Omar","I played baseball, and then I went to the beach."],["Maya","Wow! That was a great weekend!"]],"task":null,"quiz":null},{"id":"u23-l","unit":23,"kind":"Listening","title":"The lost dog","where":"Student’s Book · Unit 23 · Section 4","scene":"Miss Ana asks Omar to tell the class a picture story.","lines":[["Miss Ana","Omar, tell us your picture story. What happened first?"],["Omar","First, Omar found a dog in the park."],["Miss Ana","What happened next?"],["Omar","Next, he looked at the dog’s collar. There was a phone number."],["Miss Ana","And then?"],["Omar","Then he called the owner."],["Miss Ana","What happened finally?"],["Omar","Finally, the owner took the dog home. She was very happy!"]],"task":{"prompt":"Put the story in order. Write first, next, then or finally.","cols":["Event","Order"],"rows":[["found a dog","first"],["looked at the collar","next"],["called the owner","then"],["the owner took the dog home","finally"]]},"quiz":[["Where did Omar find the dog?",["at school","in the park","at the beach"],1],["What was on the collar?",["a name","a phone number","an address"],1],["How did the owner feel?",["sad","angry","very happy"],2]]},{"id":"u23-c","unit":23,"kind":"Conversation","title":"Talk time: A Picture Story","where":"Student’s Book · Unit 23 · ise 8","scene":"Miss Ana and the class visit the zoo.","lines":[["Miss Ana","Look, children! What are those animals?"],["Nina","They’re giraffes! They’ve got very long necks."],["Miss Ana","Yes. And what can monkeys do?"],["Omar","Monkeys can climb trees!"],["Miss Ana","Good. Can elephants jump?"],["Leo","No, they can’t. But they can swim!"],["Miss Ana","That’s right, Leo. Elephants are great swimmers."]],"task":null,"quiz":[["Where are the children?",["at the farm","at the zoo","at school"],1],["What have giraffes got?",["long necks","short legs","big ears"],0],["What can monkeys do?",["fly","swim","climb trees"],2],["What can elephants do?",["jump","swim","fly"],1]]},{"id":"w10","unit":10,"kind":"Workbook","title":"The picnic","where":"Workbook · Unit 10 · Exercise 8","scene":"Maya and Omar prepare food for a picnic in the park.","lines":[["Maya","Let’s make sandwiches for the picnic!"],["Omar","Great! I like chicken sandwiches."],["Maya","Me too. Does Leo like cheese?"],["Omar","No, he doesn’t. He likes ham."],["Maya","OK. And drinks? Do you like orange juice?"],["Omar","Yes, I do! And let’s take some apples."],["Maya","Perfect!"]],"task":null,"quiz":[["Where is the picnic?",["at school","in the park","at the beach"],1],["What sandwich does Omar like?",["chicken","cheese","egg"],0],["What does Leo like?",["cheese","fish","ham"],2],["What fruit do they take?",["bananas","apples","mangoes"],1]]},{"id":"w11","unit":11,"kind":"Workbook","title":"Shopping for a cake","where":"Workbook · Unit 11 · Exercise 8","scene":"Leo and his dad go shopping for a birthday cake.","lines":[["Dad","Leo, we need some eggs, some milk and some flour."],["Leo","How many eggs do we need?"],["Dad","Six eggs."],["Seller","Good morning! Can I help you?"],["Leo","Yes, please. Six eggs and a bottle of milk. How much is it?"],["Seller","That’s ninety pesos."],["Dad","Do you have any flour?"],["Seller","Yes, we do. Here you are."]],"task":null,"quiz":[["Why do they go shopping?",["for a cake","f d juice","a banana and water","bread and milk"],1],["How does Omar feel at the end?",["better","worse","sad"],0]]},{"id":"w22","unit":22,"kind":"Workbook","title":"Monday morning","where":"Workbook · Unit 22 · Exercise 8","scene":"Leo and Omar talk about their weekend.","lines":[["Omar","Hi, Leo! How was your weekend?"],["Leo","It was great! I went to the river with my dad."],["Omar","Cool! Did you swim?"],["Leo","Yes, I did. And we had a picnic."],["Leo","What did you do, Omar?"],["Omar","I stayed at home. I cleaned my room and played video games."],["Leo","That’s fun, too!"]],"task":null,"quiz":[["Where did Leo go?",["to the beach","to the river","to the park"],1],["Who did Leo go with?",["his dad","his mom","his sister"],0],["Did Leo swim?",["Yes, he did.","No, he didn’t.","We don’t know."],0],["What did Omar clean?",["the kitchen","the car","his room"],2]]},{"id":"w23","unit":23,"kind":"Workbook","title":"The lost backpack","where":"Workbook · Unit 23 · Exercise 8","scene":"Nina tells Miss Ana a story from her weekend.","lines":[["Nina","On Saturday, I found a backpack on the bus!"],["Miss Ana","Really? What did you do first?"],["Nina","First, I looked inside. There was a name: Tomás."],["Miss Ana","And then?"],["Nina","Then I gave it to the bus driver."],["Miss Ana","Good idea! What happened finally?"],["Nina","Finally, Tomás called the driver and got his backpack. He was very happy!"]],"task":null,"quiz":[["Where did Nina find the backpack?",["in the park","on the bus","at school"],1],["Whose backpack was it?",["Tomás’s","Leo’s","the driver’s"],0],["Who did Nina give it to?",["Miss Ana","her mom","the bus driver"],2],["How did Tomás feel?",["sad","happy","tired"],1]]},{"id":"w24","unit":24,"kind":"Workbook","title":"The end-of-year party","where":"Workbook · Unit 24 · Exercise 8","scene":"The Adventure Team prepares the end-of-year party.","lines":[["Miss Ana","Our party is on Friday. What can you bring?"],["Leo","I can bring my guitar. I can play music!"],["Maya","I’m making a big poster for the wall."],["Omar","I can bring some juice and cookies."],["Nina","And I can teach everyone a dance!"],["Miss Ana","Wonderful! This year was fantastic. I’m very proud of you!"]],"task":null,"quiz":[["When is the party?",["on Monday","on Friday","on Sunday"],1],["What can Leo bring?",["juice","his guitar","a poster"],1],["What is Maya making?",["a cake","a poster","cookies"],1],["What can Nina teach?",["a song","a dance","a game"],1]]},{"id":"j01-l","unit":101,"kind":"Listening","title":"Detective Questions","where":"Junior A2 · Unit 1 · Listening Lab","scene":"Ollie talks to three new friends. Complete the detective report.","lines":[["Ollie","Hello, detectives! Today I'm talking to three new friends. What's your name?"],["Carlos","My name is Carlos."],["Ollie","When is your birthday, Carlos?"],["Carlos","It's in March."],["Ollie","What's your favorite food?"],["Carlos","Pizza!"],["Ollie","And you? What's your name?"],["Emily","I'm Emily. My birthday is in October. I love mangoes."],["Ollie","Why do you love mangoes?"],["Emily","Because they are sweet!"],["Ollie","Hi! Who are you?"],["Kevin","I'm Kevin. My birthday is in December, and my favorite food is rice and beans."]],"task":null,"quiz":null},{"id":"j02-l","unit":102,"kind":"Listening","title":"Photo or Video?","where":"Junior A2 · Unit 2 · Listening Lab","scene":"Ollie calls three friends. What are they doing now? What do they do every day?","lines":[["Ollie","Hello, Maya! What are you doing?"],["Maya","I'm drawing a picture of my cat."],["Ollie","Do you draw every day?"],["Maya","No, I don't. I read every day."],["Ollie","Omar, what are you doing?"],["Omar","I'm washing the dishes."],["Ollie","Do you wash the dishes every day?"],["Omar","Yes, I do. It's my job at home."],["Ollie","Nina! What are you doing?"],["Nina","I'm dancing! I dance every afternoon."],["Ollie","Why do you dance?"],["Nina","Because it makes me happy!"]],"task":null,"quiz":null},{"id":"j03-l","unit":103,"kind":"Listening","title":"My Super Talents","where":"Junior A2 · Unit 3 · Listening Lab","scene":"Listen to the Talent Show interviews. Complete the table.","lines":[["Ollie","Welcome to the Talent Show! Emma, what do you love doing?"],["Emma","I love doing gymnastics."],["Ollie","Are you good at it?"],["Emma","Yes! I'm good at doing cartwheels."],["Ollie","Carlos, what do you enjoy?"],["Carlos","I enjoy cooking. I'm good at making pancakes!"],["Ollie","And Kevin?"],["Kevin","I love playing chess. I'm good at thinking!"],["Ollie","Do you like playing soccer?"],["Kevin","No, I hate running!"]],"task":null,"quiz":null},{"id":"j04-l","unit":104,"kind":"Listening","title":"Traffic Light Rules","where":"Junior A2 · Unit 4 · Listening Lab","scene":"Three friends talk about rules at home. Complete the table.","lines":[["Ollie","Omar, what are the rules in your house?"],["Omar","I have to walk my dog every day. And I mustn't play video games before dinner."],["Ollie","Maya?"],["Maya","I have to make my bed. I mustn't eat candy before lunch."],["Ollie","And you, Leo?"],["Leo","I have to practice the guitar. And I mustn't play it after nine o'clock!"],["Ollie","Why not?"],["Leo","Because my little sister goes to bed early!"]],"task":null,"quiz":null},{"id":"j05-l","unit":105,"kind":"Listening","title":"Let's Make Pancakes!","where":"Junior A2 · Unit 5 · Listening Lab","scene":"Ollie buys food for pancakes at the market. Complete the table.","lines":[["Ollie","Good morning! I'm making pancakes for my friends."],["Seller","Hello, Ollie! What do you need?"],["Ollie","How much are the bananas?"],["Seller","They're fifty pesos for six."],["Ollie","Six bananas, please. And I need some milk."],["Seller","How much milk?"],["Ollie","Two bottles, please."],["Seller","That's one hundred pesos."],["Ollie","And a few strawberries?"],["Seller","Ten strawberries are eighty pesos."],["Ollie","Great! Thank you!"]],"task":null,"quiz":null},{"id":"j06-l","unit":106,"kind":"Listening","title":"The Toy Shop","where":"Junior A2 · Unit 6 · Listening Lab","scene":"Three kids choose a toy. Which toy do they choose? Why?","lines":[["Ollie","Maya, the doll or the board game?"],["Maya","The board game! It's more fun than the doll."],["Ollie","Omar, the ball or the toy car?"],["Omar","The toy car. It's faster than my old car!"],["Ollie","Emily, the kite or the yo-yo?"],["Emily","The yo-yo. It's smaller, so it's easier to put in my bag."]],"task":null,"quiz":null},{"id":"j07-l","unit":107,"kind":"Listening","title":"When I Was a Baby","where":"Junior A2 · Unit 7 · Listening Lab","scene":"Three grandparents remember when their grandchildren were babies. Complete the table.","lines":[["Ollie","Hello, Grandma Rosa! What do you remember about Omar as a baby?"],["Grandma Rosa","Omar was a happy baby. His first word was “dog”!"],["Ollie","Really? What did he use to eat?"],["Grandma Rosa","He loved mashed bananas."],["Ollie","Grandpa Luis, tell us about Maya."],["Grandpa Luis","Maya's first word was “Mama”. She used to eat sweet potatoes every day."],["Ollie","And Nina?"],["Grandma Carmen","Nina's first word was “juice”! She loved mango juice. And she used to dance in her crib!"]],"task":null,"quiz":null},{"id":"j08-l","unit":108,"kind":"Listening","title":"Amazing Inventions","where":"Junior A2 · Unit 8 · Listening Lab","scene":"Three friends talk about last weekend. Complete the table.","lines":[["Ollie","Maya, did you go out last weekend?"],["Maya","Yes, I did. I went to the beach with my family."],["Ollie","Did you swim?"],["Maya","No, I didn't. The water was too cold!"],["Ollie","Leo, where did you go?"],["Leo","I went to my cousin's house. We played the guitar, but we didn't sing!"],["Ollie","Sofia?"],["Sofia","I went to the library. I read three books, but I didn't finish the last one."]],"task":null,"quiz":null},{"id":"j09-l","unit":109,"kind":"Listening","title":"The Stormy Night","where":"Junior A2 · Unit 9 · Listening Lab","scene":"Ollie asks three neighbors: What were you doing when the lights went out? Complete the table.","lines":[["Ollie","Mrs. Díaz, what were you doing when the lights went out?"],["Mrs. Díaz","I was cooking dinner in the kitchen. My rice was almost ready!"],["Ollie","Mr. Gómez?"],["Mr. Gómez","I was taking a shower in the bathroom. The water was very cold after that!"],["Ollie","Emma, what were you doing?"],["Emma","I was doing my homework in my bedroom. I was writing a story about a storm!"]],"task":null,"quiz":null},{"id":"j10-l","unit":110,"kind":"Listening","title":"The Story Train","where":"Junior A2 · Unit 10 · Listening Lab","scene":"Listen to Nina's trip. Write the order (1–4) and the wagon word.","lines":[["Ollie","Nina, tell us about your trip!"],["Nina","Last Sunday, I went to the river with my family. First, we took the bus to the river."],["Nina","Then, we swam in the cold water. It was great!"],["Nina","After that, we ate lunch under a big tree."],["Nina","Finally, I was so tired that I slept on the bus home!"]],"task":null,"quiz":null},{"id":"j11-l","unit":111,"kind":"Listening","title":"Animal Champions","where":"Junior A2 · Unit 11 · Listening Lab","scene":"Listen to the animal quiz show. Write the champion and the number.","lines":[["Ollie","Welcome to Animal Champions! Question one: which is the fastest bird?"],["Leo","The peregrine falcon!"],["Ollie","Correct! It can fly at more than 300 kilometers per hour when it dives."],["Ollie","Question two: which is the heaviest land animal?"],["Nina","The African elephant."],["Ollie","Yes! It can weigh 6,000 kilograms. Question three: which is the longest snake?"],["Omar","The python!"],["Ollie","Right! Some pythons are more than 6 meters long!"]],"task":null,"quiz":null},{"id":"j12-l","unit":112,"kind":"Listening","title":"Our Island Champions","where":"Junior A2 · Unit 12 · Listening Lab","scene":"Listen to a tour guide in the Colonial City of Santo Domingo. Complete the facts.","lines":[["Guide","Welcome to the Colonial City of Santo Domingo! It's the oldest city that Europeans built in the Americas."],["Guide","First, this is the Fortaleza Ozama. Builders started it in 1502. It's the oldest fortress that Europeans built in the Americas."],["Guide","Next, the Alcázar de Colón. It was the home of Diego Columbus, the son of Christopher Columbus. Builders finished it in 1514."],["Guide","Finally, the Catedral Primada. Builders finished it in 1540. It's the oldest cathedral in the Americas."]],"task":null,"quiz":null},{"id":"j13-l","unit":113,"kind":"Listening","title":"My Birthday Party","where":"Junior A2 · Unit 13 · Listening Lab","scene":"Maya calls a party shop. Complete the order.","lines":[["Shop","Hello, Party Time!"],["Maya","Hi! We're going to have a surprise party on Saturday. We need some things."],["Shop","Sure. What are you going to need?"],["Maya","Twenty balloons, please. Pink and purple."],["Shop","Anything else?"],["Maya","Ten candles. Blue, please — Nina loves blue. And twelve gift bags."],["Shop","What color?"],["Maya","Yellow!"],["Shop","Great. Are you going to pick them up on Friday?"],["Maya","Yes, we are."]],"task":null,"quiz":null},{"id":"j14-l","unit":114,"kind":"Listening","title":"Robots in 2050","where":"Junior A2 · Unit 14 · Listening Lab","scene":"Three kids look into Ollie's crystal ball. Complete the predictions.","lines":[["Ollie","Maya, look into my crystal ball. What will you be in 2050?"],["Maya","I'll be an artist! I'll paint pictures for big museums."],["Ollie","Where will you live?"],["Maya","I'll live in New York."],["Ollie","Omar?"],["Omar","I'll be a vet. I'll help animals. I won't live in a big city — I'll live on a farm!"],["Ollie","And you, Emma?"],["Emma","I may be an astronaut!"],["Ollie","Really?"],["Emma","Yes! And I'll live on a space station!"]],"task":null,"quiz":null},{"id":"j15-l","unit":115,"kind":"Listening","title":"Let's Play!","where":"Junior A2 · Unit 15 · Listening Lab","scene":"Three friends call Maya. What's the invitation? Does she say yes or no?","lines":[["Leo","Hi, Maya! Would you like to go to the movies on Friday?"],["Maya","I'd love to! What time?"],["Leo","At six."],["Nina","Maya, shall we play volleyball on Saturday morning?"],["Maya","Sorry, I can't. I have to visit my grandma. How about Saturday afternoon?"],["Nina","Good idea!"],["Omar","Hey, Maya! Let's go to the park with Rocky!"],["Maya","Sure! I'll bring a ball."]],"task":null,"quiz":null},{"id":"j16-l","unit":116,"kind":"Listening","title":"Healthy Superheroes","where":"Junior A2 · Unit 16 · Listening Lab","scene":"Three superheroes visit Dr. Ollie. Complete the table.","lines":[["Dr. Ollie","Hello, Lightning Kid! What's the problem?"],["Lightning Kid","I have a headache."],["Dr. Ollie","Do you drink water?"],["Lightning Kid","Not much."],["Dr. Ollie","You should drink more water every day."],["Water Girl","Dr. Ollie, I have a cold."],["Dr. Ollie","You should stay in bed and drink hot soup. You shouldn't go swimming today."],["Lion Boy","My teeth hurt!"],["Dr. Ollie","Do you eat a lot of candy?"],["Lion Boy","Yes, every day!"],["Dr. Ollie","You shouldn't eat so much candy, and you should brush your teeth three times a day."]],"task":null,"quiz":null},{"id":"j17-l","unit":117,"kind":"Listening","title":"Have You Ever…?","where":"Junior A2 · Unit 17 · Listening Lab","scene":"Ollie interviews three people about their experiences. Complete the table.","lines":[["Ollie","Miss Ana, have you ever been to another country?"],["Miss Ana","Yes, I have. I've been to Canada. I saw snow there!"],["Ollie","Have you ever eaten sushi?"],["Miss Ana","No, I've never eaten sushi."],["Ollie","Grandma Rosa, have you ever flown on a plane?"],["Grandma Rosa","Yes, many times! I've been to New York. But I've never ridden a horse."],["Ollie","Pedro?"],["Pedro","I've been to La Vega for Carnival. But I've never seen snow!"]],"task":null,"quiz":null},{"id":"j18-l","unit":118,"kind":"Listening","title":"Mission Checklist","where":"Junior A2 · Unit 18 · Listening Lab","scene":"Listen to Sofia and her mom before a trip. Has it been done already ✅ or not yet ⏳?","lines":[["Mom","Sofia, we're going to the airport at three. Have you packed your suitcase yet?"],["Sofia","Yes, Mom. I've already packed it."],["Mom","Great. Have you fed Kiko?"],["Sofia","Not yet! I'll do it now."],["Mom","And the tickets?"],["Sofia","Dad has just printed them. They're on the table."]],"task":null,"quiz":null},{"id":"j19-l","unit":119,"kind":"Listening","title":"Treasure Hunt","where":"Junior A2 · Unit 19 · Listening Lab","scene":"Listen to the directions for the zoo treasure hunt. Complete the table.","lines":[["Ollie","Welcome to the Zoo Treasure Hunt! Listen carefully."],["Ollie","Step one: go through the big gate."],["Ollie","Step two: walk along the flamingo lake."],["Ollie","Step three: go past the giraffes and up the stairs."],["Ollie","The treasure is next to the parrots. Good luck!"]],"task":null,"quiz":null},{"id":"j20-l","unit":120,"kind":"Listening","title":"When I Grow Up","where":"Junior A2 · Unit 20 · Listening Lab","scene":"Three kids talk about their dream jobs. Complete the table.","lines":[["Ollie","Carlos, what do you want to be?"],["Carlos","I want to be a chef, because I love making pancakes!"],["Ollie","Emily?"],["Emily","I'd like to be a scientist. I want to study the ocean, because I love sea turtles."],["Ollie","And Kevin?"],["Kevin","I want to be a programmer. I love computers, so I want to make video games!"]],"task":null,"quiz":null},{"id":"j21-l","unit":121,"kind":"Listening","title":"The Feelings Monster","where":"Junior A2 · Unit 21 · Listening Lab","scene":"Three friends tell Ollie how they feel. Complete the table.","lines":[["Ollie","Maya, how do you feel today?"],["Maya","I'm excited! We're going to the beach this weekend."],["Ollie","Leo, are you OK?"],["Leo","I'm worried. I have a guitar concert tomorrow, and it's my first one."],["Ollie","Sofia?"],["Sofia","I'm a little bored. It's raining, and I can't go outside. But my book is interesting!"]],"task":null,"quiz":null},{"id":"j22-l","unit":122,"kind":"Listening","title":"Save the Turtles!","where":"Junior A2 · Unit 22 · Listening Lab","scene":"A scientist gives three rules for Turtle Beach. Complete the table.","lines":[["Scientist","Hello, detectives! Here are three rules for Turtle Beach."],["Scientist","Number one: if you use a flashlight at night, the baby turtles will get confused. Use a red light instead."],["Scientist","Number two: if you leave plastic bags on the beach, turtles will think they're jellyfish, and they'll eat them."],["Scientist","Number three: if you stay away from the nests, the eggs will be safe. Thank you for helping!"]],"task":null,"quiz":null},{"id":"j23-l","unit":123,"kind":"Listening","title":"How Is Chocolate Made?","where":"Junior A2 · Unit 23 · Listening Lab","scene":"Listen to a tour of a juice factory. Complete the steps.","lines":[["Guide","Welcome to Sunny Juice Factory! First, the oranges are washed by workers."],["Guide","Then, they are cut by a big machine."],["Guide","After that, the juice is put into bottles by another machine."],["Guide","Finally, the bottles are checked by workers, and then they are sent to the supermarkets!"]],"task":null,"quiz":null},{"id":"j24-l","unit":124,"kind":"Listening","title":"Our Big Show","where":"Junior A2 · Unit 24 · Listening Lab","scene":"Listen to the show program. Complete the table.","lines":[["Miss Ana","Good evening, families! Welcome to the Hadash Big Show!"],["Miss Ana","In Act 1, Omar is going to tell a mystery story."],["Miss Ana","In Act 2, Leo and Nina are going to play music and dance."],["Miss Ana","And in Act 3, Sofia is going to sing a song in English."],["Miss Ana","After the show, there will be cake and juice for everyone!"]],"task":null,"quiz":null}],"speakers":{"Miss Ana":{"pitch":1.05,"rate":0.92,"color":"#6941C6","g":"f","kid":false},"Maya":{"pitch":1.5,"rate":0.95,"color":"#1673E6","g":"f","kid":true},"Leo":{"pitch":1.25," let voices = [];
function vq(v){const n=v.name+' '+(v.voiceURI||''),l=(v.lang||'').replace('_','-').toLowerCase();let s=1;if(/natural|neural/i.test(n))s=6;else if(/online/i.test(n))s=5;else if(/google|premium|enhanced|siri/i.test(n))s=4;else if(/samantha|ava|allison|alex|daniel|karen|moira|paulina|monica|juan/i.test(n))s=3;if(/zira|david|mark|hazel|helena|sabina|espeak|compact/i.test(n))s=0;if(l==='en-us'||l==='es-us'||l==='es-mx'||l==='es-419')s+=0.5;return s}

if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const FEM = /\b(female|woman|samantha|victoria|karen|moira|tessa|fiona|veena|zira|aria|jenny|ava|ana|allison|susan|hazel|libby|sonia|michelle|emma|joanna|salli|kimberly|ivy|kendra|nicky|serena|catherine|natasha|clara|martha|kathy|shelley|sandy|flo|grandma|nora|amy|ruth|google us english|x-sfg|x-tpc|x-tpf|x-iob|x-iog|x-gba|x-gbc|x-gbg|x-fis)\b/i;
const MAL = /\b(male|man|alex|daniel|fred|tom|aaron|arthur|oliver|gordon|rishi|david|mark|guy|ryan|george|christopher|eric|brian|matthew|joey|justin|william|liam|andrew|roger|steffan|davis|jason|tony|grandpa|rocko|reed|eddy|ralph|albert|stephen|x-iol|x-iom|x-tpd|x-gbb|x-gbd|x-rjs)\b/i;
function vg(v){ const n = v.name + ' ' + (v.voiceURI || ''); return /female/i.test(n) ? 'f' : MAL.test(n) ? 'm' : FEM.test(n) ? 'f' : '?'; }
function pick(name){
  const sp = DATA.speakers[name] || {g:'f'}; const g = sp.g || 'f';
  const us = list => { const a = list.filter(v => /en[-_]US/i.test(v.lang)); return a.length ? a : list; };
  let pool = us(voices.filter(v => vg(v) === g)), match = true;
  if (!pool.length){ pool = us(voices.filter(v => vg(v) === '?')); match = false; }
  if (!pool.length){ pool = us(voices); match = false; }
  const same = Object.keys(DATA.speakers).filter(k => (DATA.speakers[k].g || 'f') === g);
  const v = pool.length ? pool[Math.max(0, same.indexOf(name)) % pool.length] : null;
  let pitch;
  if (match) pitch = sp.kid ? (g === 'm' ? 1.15 : 1.25) : 1.0;
  else pitch = g === 'm' ? (sp.kid ? 0.7 : 0.5) : (sp.kid ? 1.45 : 1.2);
  return {v, pitch};
}
function voiceFor(name){ return voices.length ? pick(name).v : null; }
let slow = false;
let AUD = {}, curA = null;
fetch('audio/manifest.json').then(r => r.ok ? r.json() : {}).then(m => { AUD = m || {}; }).catch(() => {});
let spTok = 0;
function stopAll(){ spTok++; try { speechSynthesis.cancel(); } catch(e){} if (curA){ const a = curA; curA = null; a.pause(); a.dispatchEvent(new Event('ended')); } }
function playFile(f){
  return new Promise(res => {
    const a = new Audio('audio/' + f); curA = a; a.preservesPitch = true; a.playbackRate = slow ? 0.8 : 1;
    let fin = false; const done = ok => { if (fin) return; fin = true; if (curA === a) curA = null; res(ok); };
    a.addEventListener('ended', () => done(true)); a.addEventListener('error', () => done(false));
    const pr = a.play(); if (pr && pr.catch) pr.catch(() => done(false));

}
const LETTER = {A:'ay',B:'bee',C:'see',D:'dee',E:'ee',F:'eff',G:'gee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'el',M:'em',N:'en',O:'oh',P:'pee',Q:'cue',R:'are',S:'ess',T:'tee',U:'you',V:'vee',W:'double you',X:'ex',Y:'why',Z:'zee'};
const SPELLED = /\b[A-Z](?:(?:-|\.\s)[A-Z]){2,}\b\.?/;
function spellParts(text){ // "I'm Kevin. K-E-V-I-N." -> ["I'm Kevin.", {l:"K"}, {l:"E"}, ...]
  const out = []; let rest = text, m;
  while ((m = rest.match(SPELLED))){ const pre = rest.slice(0, m.index).trim(); if (pre) out.push(pre);
    m[0].replace(/[^A-Z]/g, '').split('').forEach(c => out.push({l:c})); rest = rest.slice(m.index + m[0].length); }
  if (rest.trim()) out.push(rest.trim()); return out; }
async function speakSpelled(name, text){ // letter by letter, with a short pause, so children hear every letter
  const my = spTok;
  for (const p of spellParts(text)){ if (my !== spTok) return;
    if (typeof p === 'string'){ await ttsSpeak(name, p); await new Promise(r => setTimeout(r, 250)); }
    else { await ttsSpeak(name, LETTER[p.l] || p.l, 0.8); await new Promise(r => setTimeout(r, slow ? 650 : 450)); } } }
function speak(name, text){

function ttsSpeak(name, text, rf){
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();

    const pk = voices.length ? pick(name) : {v:null, pitch: (sp.g === 'm' ? 0.6 : 1.25)};

let playing = false;
async function playAll(t){
  if (playing){ stopAll(); playing = false; setPlayBtn(false); return; }
  playing = true; setPlayBtn(true);
  for (let i = 0; i < t.lines.length && playing; i++){
    document.querySelectorAll('.ln').forEach(el => el.classList.toggle('now', +el.dataset.i === i));
    const [s, d, sp] = t.lines[i];

function setPlayBtn(on){ const b = $('#playbtn'); if (b) b.innerHTML = on ? '⏹ Stop' : '▶ Listen'; }
