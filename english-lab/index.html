<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Lab · My English Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--ink:#14213D;--ink2:#465375;--bg:#F4F7FF;--card:#fff;--sun:#FFC400;--blue:#1673E6;--line:#DDE3F0;--ok:#1E9E45;--bad:#E53935}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:'Fredoka','Nunito',sans-serif;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
.top{background:linear-gradient(120deg,#0B4FB3,#1673E6 60%,#3BA0FF);color:#fff;padding:18px 0 26px;border-radius:0 0 28px 28px}
.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;border-radius:14px;background:var(--sun);display:flex;align-items:center;justify-content:center;font-size:26px}
.brand small{display:block;font-weight:700;letter-spacing:.14em;font-size:11px;opacity:.85}
.brand h1{font-size:26px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;background:rgba(255,255,255,.18);border-radius:20px;padding:6px 14px;font-weight:700;margin-bottom:12px}
.unit{background:var(--card);border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 2px 0 var(--line)}
.unit h2{font-size:20px;display:flex;gap:10px;align-items:center}
.un{background:var(--u,#1673E6);color:#fff;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px}
.tl{display:grid;gap:8px;margin-top:12px}
.ti{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px;color:var(--ink);text-decoration:none;font-weight:700}
.ti .ic{font-size:24px}.ti span{flex:1}.ti em{font-style:normal;font-size:12px;color:var(--ink2);font-weight:600;display:block}
.tag{font-size:11px;font-weight:800;border-radius:10px;padding:3px 9px;background:#E7F1FF;color:#0B4FB3;letter-spacing:.04em}
.tag.Conversation{background:#FFF0E0;color:#A84A00}.tag.Workbook{background:#E2F7E8;color:#126B2C}
.hero{margin-top:-14px;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 20px rgba(20,33,61,.08)}
.hero h2{font-size:26px;margin-top:6px}.hero .wh{color:var(--ink2);font-size:13px;font-weight:700}
.scene{background:#FFF8DC;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:15px}
.cast{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fredoka';font-size:22px;border:3px solid #fff;box-shadow:0 0 0 2px var(--c,#ccc)}
.av svg{width:56px;height:56px}
.who{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;gap:3px}
.player{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.play{background:var(--sun);color:var(--ink);font-family:'Fredoka';font-size:20px;border-radius:40px;padding:12px 24px;box-shadow:0 4px 0 #D9A400;display:flex;align-items:center;gap:8px}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 #D9A400}
.chipbtn{background:#EEF2FA;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.sec{background:var(--card);border-radius:22px;padding:18px;margin-top:16px}
.sec h3{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec h3 i{font-style:normal;background:var(--blue);color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.lines{display:grid;gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:8px 10px;transition:background .2s}
.ln .av{width:40px;height:40px;font-size:16px;flex:none}.ln .av svg{width:44px;height:44px}
.ln b{display:block;font-size:13px;color:var(--c)}
.ln.now{background:#FFF3C4}
.ln button{margin-left:auto;background:#EEF2FA;border-radius:50%;width:36px;height:36px;flex:none}
.hidden-text .ln p{filter:blur(6px);user-select:none}
.ttab{width:100%;border-collapse:separate;border-spacing:0 6px}
.ttab th{text-align:left;font-size:13px;color:var(--ink2);padding:0 6px}
.ttab td{padding:0 6px}
.ttab input{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.ttab input.ok{border-color:var(--ok);background:#EBF9EF}.ttab input.bad{border-color:var(--bad);background:#FDECEC}
.given{font-weight:800}
.check{background:var(--blue);color:#fff;border-radius:30px;padding:10px 22px;font-family:'Fredoka';font-size:17px;margin-top:10px}
.score{font-family:'Fredoka';font-size:18px;margin-left:12px}
.q{margin-top:12px}.q p{font-weight:800;margin:0 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:#EEF2FA;border-radius:14px;padding:10px 14px;font-weight:700}
.opt.ok{background:#D6F5DE;color:#126B2C}.opt.bad{background:#FDE0E0;color:#A11}
.rp{display:grid;gap:10px}
.rpbar{display:flex;gap:8px;flex-wrap:wrap}
.say{background:#FFF8DC;border:2px dashed #E0A800;border-radius:16px;padding:14px;font-size:19px;font-weight:700}
.mic{background:var(--bad);color:#fff;border-radius:30px;padding:10px 20px;font-family:'Fredoka';font-size:17px}
.fb{font-weight:800}
.stars{font-size:28px;letter-spacing:4px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.qrc{background:#fff;border-radius:16px;padding:14px;text-align:center;break-inside:avoid}
.qrc .code{display:flex;justify-content:center;margin:8px 0}
.qrc b{font-family:'Fredoka';font-size:16px}.qrc small{display:block;color:var(--ink2);font-size:12px}
.note{font-size:13px;color:var(--ink2);margin-top:10px}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:-14px}
.bk{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:22px;padding:20px;color:var(--ink);text-decoration:none;box-shadow:0 6px 20px rgba(20,33,61,.08);border-top:6px solid var(--b);transition:transform .15s,box-shadow .15s}
.bk:hover,.bk:focus-visible{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,33,61,.14)}
.bk h2{font-size:21px;margin-top:10px}.bk p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
.bkic{font-size:34px;width:58px;height:58px;border-radius:16px;background:color-mix(in srgb,var(--b) 14%,#fff);display:flex;align-items:center;justify-content:center}
.bklv{position:absolute;top:20px;right:20px;background:var(--b);color:#fff;font-family:'Fredoka';border-radius:12px;padding:4px 12px;font-size:16px}
.bk .bkage{font-weight:800;color:var(--b);font-size:13px;margin-top:2px}
.bkmeta{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 14px}
.bkgo{margin-top:auto;align-self:flex-start;display:inline-block;background:var(--b);color:#fff;font-family:'Fredoka';border-radius:30px;padding:9px 18px;font-size:16px}
@media print{.top,.noprint{display:none}.qrgrid{grid-template-columns:repeat(3,1fr)}body{background:#fff}}
</style>
</head>

ls."], ["Miss Ana", "Thank you, Leo. How old are you, Nina?"], ["Nina", "I’m ten."]], "task": null, "quiz": null}, {"id": "u04-l", "unit": 4, "kind": "Listening", "title": "Color the picture", "where": "Student’s Book · Unit 4 · Section 8", "scene": "Miss Ana shows Omar her picture of shapes.", "lines": [["Miss Ana", "Look at my picture, Omar. Can you see the star?"], ["Omar", "Yes! It’s a big star. What color is it?"], ["Miss Ana", "The big star is yellow."], ["Omar", "And the circle?"], ["Miss Ana", "The circle is small. It’s red."], ["Omar", "Is the square blue?"], ["Miss Ana", "Yes, it is. It’s a big blue square!"], ["Omar", "I like your picture, Miss Ana!"]], "task": {"prompt": "Write the color and the size of each shape.", "cols": ["Shape", "Color", "Big or small?"], "rows": [["star", "yellow", "big"], ["circle", "red", "small"], ["square", "blue", "big"]]}, "quiz": [["What color is the star?", ["red", "yellow", "blue"], 1], ["Is the circle big or small?", ["big", "small", "very big"], 1], ["What color is the square?", ["blue", "green", "yellow"], 0]]}, {"id": "u04-c", "unit": 4, "kind": "Conversation", "title": "Talk time: Colors, Shapes and Descriptions", "where": "Student’s Book · Unit 4 · Section 3", "scene": "Maya and Omar make a poster.", "lines": [["Maya", "Look! What color is the star?"], ["Omar", "It’s yellow."], ["Maya", "Is the circle blue?"], ["Omar", "No, it isn’t. It’s red."], ["Maya", "What color are the triangles?"], ["Omar", "They’re green. They’re big triangles!"]], "task": null, "quiz": null}, {"id": "u05-l", "unit": 5, "kind": "Listening", "title": "Lost and found", "where": "Student’s Book · Unit 5 · Section 8", "scene": "After class, Miss Ana finds some things on the floor.", "lines": [["Miss Ana", "Whose pencil is this?"], ["Maya", "It’s my pencil! It’s blue."], ["Miss Ana", "Here you are, Maya. And this yellow ruler?"], ["Omar", "That’s my ruler. Thank you, Miss Ana!"], ["Miss Ana", "You’re welcome. Is this green backpack yours, Leo?"], sn’t feel well and visits the school nurse.", "lines": [["Nurse", "Hello, Leo. How do you feel?"], ["Leo", "I feel tired. And I have got a headache."], ["Nurse", "Oh, I’m sorry. Would you like some water?"], ["Leo", "Yes, please."], ["Nurse", "Here you are. Sit down and rest for ten minutes."], ["Leo", "Thank you. I feel a little better."], ["Nurse", "Good. Go to bed early tonight, OK?"], ["Leo", "OK. Thank you!"]], "task": {"prompt": "Complete the notes.", "cols": ["Question", "Answer"], "rows": [["How does Leo feel?", "tired"], ["What has he got?", "a headache"], ["How many minutes does he rest?", "10"]]}, "quiz": [["How does Leo feel?", ["happy", "tired", "hungry"], 1], ["What does the nurse give Leo?", ["water", "juice", "medicine"], 0], ["What is the nurse’s advice?", ["Play football.", "Go to bed early.", "Eat candy."], 1]]}, {"id": "u21-c", "unit": 21, "kind": "Conversation", "title": "Talk time: Feelings, Health and Advice", "where": "Student’s Book · Unit 21 · Section 3", "scene": "Leo looks sad at break time. Maya asks him.", "lines": [["Maya", "Leo, are you OK? How do you feel?"], ["Leo", "I feel tired, and I have a headache."], ["Maya", "Oh no! Would you like some water?"], ["Leo", "Yes, please. Thank you."], ["Maya", "Sit down and rest a little."], ["Leo", "Thanks, Maya. I feel better now."]], "task": null, "quiz": null}, {"id": "u22-l", "unit": 22, "kind": "Listening", "title": "Last weekend", "where": "Student’s Book · Unit 22 · Section 4", "scene": "Maya and Omar talk on Monday morning.", "lines": [["Omar", "Hi, Maya! What did you do yesterday?"], ["Maya", "I visited my grandmother."], ["Omar", "Did you watch TV?"], ["Maya", "Yes, I did. We watched a movie together."], ["Omar", "Nice! I played baseball on Saturday."], ["Maya", "Did your team win?"], ["Omar", "Yes, it did! Then we went to the beach."], ["Maya", "Wow! You had a great weekend."]], "task": {"prompt": "What did they do? Write it.", "cols": ["Name", "Activity"], "rows": [["Maya", "visited her grandmother"], ["Maya", "watched a movie"], ["Omar", "played baseball"], ["Omar", "went to the beach"]]}, "quiz": [["Who did Maya visit?", ["her aunt", "her grandmother", "her friend"], 1], ["What did Omar play?", ["football", "basketball", "baseball"], 2], ["Did Omar’s team win?", ["Yes, it did.", "No, it didn’t.", "We don’t know."], 0]]}, {"id": "u22-c", "unit": 22, "kind": "Conversation", "title": "Talk time: Yesterday and Last Weekend", "where": "Student’s Book · Unit 22 · Section 3", "scene": "Omar and Maya meet on Monday morning.", "lines": [["Omar", "Hi, Maya! What did you do last weekend?"], ["Maya", "I visited my grandma in Santiago."], ["Omar", "Cool! Did you go by bus?"], ["Maya", "Yes, I did. What about you?"], ["Omar", "I played baseball, and then I went to the beach."], ["Maya", "Wow! That was a great weekend!"]], "task": null, "quiz": null}, {"id": "u23-l", "unit": 23, "kind": "Listening", "title": "The lost dog", "where": "Student’s Book · Unit 23 · Section 4", "scene": "Miss Ana asks Omar to tell the class a picture story.", "lines": [["Miss Ana", "Omar, tell us your picture story. What happened first?"], ["Omar", "First, Omar found a dog in the park."], ["Miss Ana", "What happened next?"], ["Omar", "Next, he looked at the dog’s collar. There was a phone number."], ["Miss Ana", "And then?"], ["Omar", "Then he called the owner."], ["Miss Ana", "What happened finally?"], ["Omar", "Finally, the owner took the dog home. She was very happy!"]], "task": {"prompt": "Put the story in order. Write first, next, then or finally.", "cols": ["Event", "Order"], "rows": [["found a dog", "first"], ["looked at the collar", "next"], ["called the owner", "then"], ["the owner took the dog home", "finally"]]}, "quiz": [["Where did Omar find the dog?", ["at school", "in the park", "at the beach"], 1], ["What was on the collar?", ["a name", "a phone number", "an address"], 1], ["How did the owner feel?", ["sad", "angry", "very happy"], 2]]}, {"id": "u23-c", "unit": 23, "kind": "Conversation", "title": "Talk time: A Picture Story", "where": "Student’s Book · Unit 23 · Section 3", "scene": "Miss Ana asks Omar about his picture story.", "lines": [["Miss Ana", "Omar, tell me your story. What happened first?"], ["Omar", "First, a boy found a little dog in the park."], ["Miss Ana", "What happened next?"], ["Omar", "Next, he looked at the dog’s collar."], ["Miss Ana", "And then?"], ["Omar", "Then he called the owner. Finally, the dog went home!"]], "task": null, "quiz": null}, {"id": "u24-l", "unit": 24, "kind": "Listening", "title": "My English project", "where": "Student’s Book · Unit 24 · Section 4", "scene": "Leo presents his final project to Miss Ana.", "lines": [["Miss Ana", "Leo, tell me about your project."], ["Leo", "This is my family. We live near a park."], ["Miss Ana", "Very nice! What do you like doing?"], ["Leo", "I like reading. And I can play basketball."], ["Miss Ana", "What are you doing in this photo?"], ["Leo", "I am reading in the park with my sister."], ["Miss Ana", "And what did you do last weekend?"], ["Leo", "I went to the library. I learned a lot of English this year!"]], "task": {"prompt": "Complete Leo’s project.", "cols": ["Question", "Answer"], "rows": [["Where does he live?", "near a park"], ["What does he like?", "reading"], ["What can he play?", "basketball"], ["Last weekend?", "library"]]}, "quiz": [["Where does Leo’s family live?", ["near a beach", "near a park", "near a school"], 1], ["Who is with Leo in the photo?", ["his sister", "his brother", "his mom"], 0], ["Where did Leo go last weekend?", ["to the park", "to the library", "to the market"], 1]]}, {"id": "u24-c", "unit": 24, "kind": "Conversation", "title": "Talk time: My Big English Adventure", "where": "Student’s Book · Unit 24 · Section 3", "scene": "Leo presents his final project to Miss Ana.", "lines": [["Miss Ana", "Leo, tell me about your project."], ["Leo", "This is me and my family. We live in Santo Domingo."], ["Miss Ana", "What do you like doing?"], ["Leo", "I like reading comics, and I can play basketball."], ["Miss Ana", "What did you learn this year?"], ["Leo", "I learned a lot of English! Thank you, Miss Ana!"]], "task": null, "quiz": null}, {"id": "j01-l", "unit": 101, "kind": "Listening", "title": "Detective Questions", "where": "Junior A2 · Unit 1 · Listening Lab", "scene": "Ollie talks to three new friends. Complete the detective report.", "lines": [["Ollie", "Hello, detectives! Today I'm talking to three new friends. What's your name?"], ["Carlos", "My name is Carlos."], ["Ollie", "When is your birthday, Carlos?"], ["Carlos", "It's in March."], ["Ollie", "What's your favorite food?"], ["Carlos", "Pizza!"], ["Ollie", "And you? What's your name?"], ["Emily", "I'm Emily. My birthday is in October. I love mangoes."], ["Ollie", "Why do you love mangoes?"], ["Emily", "Because they are sweet!"], ["Ollie", "Hi! Who are you?"], ["Kevin", "I'm Kevin. My birthday is in December, and my favorite food is rice and beans."]], "task": null, "quiz": null}, {"id": "j02-l", "unit": 102, "kind": "Listening", "title": "Photo or Video?", "where": "Junior A2 · Unit 2 · Listening Lab", "scene": "Ollie calls three friends. What are they doing now? What do they do every day?", "lines": [["Ollie", "Hello, Maya! What are you doing?"], ["Maya", "I'm drawing a picture of my cat."], ["Ollie", "Do you draw every day?"], ["Maya", "No, I don't. I read every day."], ["Ollie", "Omar, what are you doing?"], ["Omar", "I'm washing the dishes."], ["Ollie", "Do you wash the dishes every day?"], ["Omar", "Yes, I do. It's my job at home."], ["Ollie", "Nina! What are you doing?"], ["Nina", "I'm dancing! I dance every afternoon."], ["Ollie", "Why do you dance?"], ["Nina", "Because it makes me happy!"]], "task": null, "quiz": null}, {"id": "j03-l", "unit": 103, "kind": "Listening", "title": "My Super Talents", "where": "Junior A2 · Unit 3 · Listening Lab", "scene": "Listen to the Talent Show interviews. Complete the table.", "lines": [["Ollie", "Welcome to the Talent Show! Emma, what do you love doing?"], ["Emma", "I love doing gymnastics."], ["Ollie", "Are you good at it?"], ["Emma", "Yes! I'm good at doing cartwheels."], ["Ollie", "Carlos, what do you enjoy?"], ["Carlos", "I enjoy cooking. I'm good at making pancakes!"], ["Ollie", "And Kevin?"], ["Kevin", "I love playing chess. I'm good at thinking!"], ["Ollie", "Do you like playing soccer?"], ["Kevin", "No, I hate running!"]], "task": null, "quiz": null}, {"id": "j04-l", "unit": 104, "kind": "Listening", "title": "Traffic Light Rules", "where": "Junior A2 · Unit 4 · Listening Lab", "scene": "Three friends talk about rules at home. Complete the table.", "lines": [["Ollie", "Omar, what are the rules in your house?"], ["Omar", "I have to walk my dog every day. And I mustn't play video games before dinner."], ["Ollie", "Maya?"], ["Maya", "I have to make my bed. I mustn't eat candy before lunch."], ["Ollie", "And you, Leo?"], ["Leo", "I have to practice the guitar. And I mustn't play it after nine o'clock!"], ["Ollie", "Why not?"], ["Leo", "Because my little sister goes to bed early!"]], "task": null, "quiz": null}, {"id": "j05-l", "unit": 105, "kind": "Listening", "title": "Let's Make Pancakes!", "where": "Junior A2 · Unit 5 · Listening Lab", "scene": "Ollie buys food for pancakes at the market. Complete the table.", "lines": [["Ollie", "Good morning! I'm making pancakes for my friends."], ["Seller", "Hello, Ollie! What do you need?"], ["Ollie", "How much are the bananas?"], ["Seller", "They're fifty pesos for six."], ["Ollie", "Six bananas, please. And I need some milk."], ["Seller", "How much milk?"], ["Ollie", "Two bottles, please."], ["Seller", "That's one hundred pesos."], ["Ollie", "And a few strawberries?"], ["Seller", "Ten strawberries are eighty pesos."], ["Ollie", "Great! Thank you!"]], "task": null, "quiz": null}, {"id": "j06-l", "unit": 106, "kind": "Listening", "title": "The Toy Shop", "where": "Junior A2 · Unit 6 · Listening Lab", "scene": "Three kids choose a toy. Which toy do they choose? Why?", "lines": [["Ollie", "Maya, the doll or the board game?"], ["Maya", "The board game! It's more fun than the doll."], ["Ollie", "Omar, the ball or the toy car?"], ["Omar", "The toy car. It's faster than my old car!"], ["Ollie", "Emily, the kite or the yo-yo?"], ["Emily", "The yo-yo. It's smaller, so it's easier to put in my bag."]], "task": null, "quiz": null}, {"id": "j07-l", "unit": 107, "kind": "Listening", "title": "When I Was a Baby", "where": "Junior A2 · Unit 7 · Listening Lab", "scene": "Three grandparents remember when their grandchildren were babies. Complete the table.", "lines": [["Ollie", "Hello, Grandma Rosa! What do you remember about Omar as a baby?"], ["Grandma Rosa", "Omar was a happy baby. His first word was “dog”!"], ["Ollie", "Really? What did he use to eat?"], ["Grandma Rosa", "He loved mashed bananas."], ["Ollie", "Grandpa Luis, tell us about Maya."], ["Grandpa Luis", "Maya's first word was “Mama”. She used to eat sweet potatoes every day."], ["Ollie", "And Nina?"], ["Grandma Carmen", "Nina's first word was “juice”! She loved mango juice. And she used to dance in her crib!"]], "task": null, "quiz": null}, {"id": "j08-l", "unit": 108, "kind": "Listening", "title": "Amazing Inventions", "where": "Junior A2 · Unit 8 · Listening Lab", "scene": "Three friends talk about last weekend. Complete the table.", "lines": [["Ollie", "Maya, did you go out last weekend?"], ["Maya", "Yes, I did. I went to the beach with my family."], ["Ollie", "Did you swim?"], ["Maya", "No, I didn't. The water was too cold!"], ["Ollie", "Leo, where did you go?"], ["Leo", "I went to my cousin's house. We played the guitar, but we didn't sing!"], ["Ollie", "Sofia?"], ["Sofia", "I went to the library. I read three books, but I didn't finish the last one."]], "task": null, "quiz": null}, {"id": "j09-l", "unit": 109, "kind": "Listening", "title": "The Stormy Night", "where": "Junior A2 · Unit 9 · Listening Lab", "scene": "Ollie asks three neighbors: What were you doing when the lights went out? Complete the table.", "lines": [["Ollie", "Mrs. Díaz, what were you doing when the lights went out?"], ["Mrs. Díaz", "I was cooking dinner in the kitchen. My rice was almost ready!"], ["Ollie", "Mr. Gómez?"], ["Mr. Gómez", "I was taking a shower in the bathroom. The water was very cold after that!"], ["Ollie", "Emma, what were you doing?"], ["Emma", "I was doing my homework in my bedroom. I was writing a story about a storm!"]], "task": null, "quiz": null}, {"id": "j10-l", "unit": 110, "kind": "Listening", "title": "The Story Train", "where": "Junior A2 · Unit 10 · Listening Lab", "scene": "Listen to Nina's trip. Write the order (1–4) and the wagon word.", "lines": [["Ollie", "Nina, tell us about your trip!"], ["Nina", "Last Sunday, I went to the river with my family. First, we took the bus to the river."], ["Nina", "Then, we swam in the cold water. It was great!"], ["Nina", "After that, we ate lunch under a big tree."], ["Nina", "Finally, I was so tired that I slept on the bus home!"]], "task": null, "quiz": null}, {"id": "j11-l", "unit": 111, "kind": "Listening", "title": "Animal Champions", "where": "Junior A2 · Unit 11 · Listening Lab", "scene": "Listen to the animal quiz show. Write the champion and the number.", "lines": [["Ollie", "Welcome to Animal Champions! Question one: which is the fastest bird?"], ["Leo", "The peregrine falcon!"], ["Ollie", "Correct! It can fly at more than 300 kilometers per hour when it dives."], ["Ollie", "Question two: which is the heaviest land animal?"], ["Nina", "The African elephant."], ["Ollie", "Yes! It can weigh 6,000 kilograms. Question three: which is the longest snake?"], ["Omar", "The python!"], ["Ollie", "Right! Some pythons are more than 6 meters long!"]], "task": null, "quiz": null}, {"id": "j12-l", "unit": 112, "kind": "Listening", "title": "Our Island Champions", "where": "Junior A2 · Unit 12 · Listening Lab", "scene": "Listen to a tour guide in the Colonial City of Santo Domingo. Complete the facts.", "lines": [["Guide", "Welcome to the Colonial City of Santo Domingo! It's the oldest city that Europeans built in the Americas."], ["Guide", "First, this is the Fortaleza Ozama. Builders started it in 1502. It's the oldest fortress that Europeans built in the Americas."], ["Guide", "Next, the Alcázar de Colón. It was the home of Diego Columbus, the son of Christopher Columbus. Builders finished it in 1514."], ["Guide", "Finally, the Catedral Primada. Builders finished it in 1540. It's the oldest cathedral in the Americas."]], "task": null, "quiz": null}, {"id": "j13-l", "unit": 113, "kind": "Listening", "title": "My Birthday Party", "where": "Junior A2 · Unit 13 · Listening Lab", "scene": "Maya calls a party shop. Complete the order.", "lines": [["Shop", "Hello, Party Time!"], ["Maya", "Hi! We're going to have a surprise party on Saturday. We need some things."], ["Shop", "Sure. What are you going to need?"], ["Maya", "Twenty balloons, please. Pink and purple."], ["Shop", "Anything else?"], ["Maya", "Ten candles. Blue, please — Nina loves blue. And twelve gift bags."], ["Shop", "What color?"], ["Maya", "Yellow!"], ["Shop", "Great. Are you going to pick them up on Friday?"], ["Maya", "Yes, we are."]], "task": null, "quiz": null}, {"id": "j14-l", "unit": 114, "kind": "Listening", "title": "Robots in 2050", "where": "Junior A2 · Unit 14 · Listening Lab", "scene": "Three kids look into Ollie's crystal ball. Complete the predictions.", "lines": [["Ollie", "Maya, look into my crystal ball. What will you be in 2050?"], ["Maya", "I'll be an artist! I'll paint pictures for big museums."], ["Ollie", "Where will you live?"], ["Maya", "I'll live in New York."], ["Ollie", "Omar?"], ["Omar", "I'll be a vet. I'll help animals. I won't live in a big city — I'll live on a farm!"], ["Ollie", "And you, Emma?"], ["Emma", "I may be an astronaut!"], ["Ollie", "Really?"], ["Emma", "Yes! And I'll live on a space station!"]], "task": null, "quiz": null}, {"id": "j15-l", "unit": 115, "kind": "Listening", "title": "Let's Play!", "where": "Junior A2 · Unit 15 · Listening Lab", "scene": "Three friends call Maya. What's the invitation? Does she say yes or no?", "lines": [["Leo", "Hi, Maya! Would you like to go to the movies on Friday?"], ["Maya", "I'd love to! What time?"], ["Leo", "At six."], ["Nina", "Maya, shall we play volleyball on Saturday morning?"], ["Maya", "Sorry, I can't. I have to visit my grandma. How about Saturday afternoon?"], ["Nina", "Good idea!"], ["Omar", "Hey, Maya! Let's go to the park with Rocky!"], ["Maya", "Sure! I'll bring a ball."]], "task": null, "quiz": null}, {"id": "j16-l", "unit": 116, "kind": "Listening", "title": "Healthy Superheroes", "where": "Junior A2 · Unit 16 · Listening Lab", "scene": "Three superheroes visit Dr. Ollie. Complete the table.", "lines": [["Dr. Ollie", "Hello, Lightning Kid! What's the problem?"], ["Lightning Kid", "I have a headache."], ["Dr. Ollie", "Do you drink water?"], ["Lightning Kid", "Not much."], ["Dr. Ollie", "You should drink more water every day."], ["Water Girl", "Dr. Ollie, I have a cold."], ["Dr. Ollie", "You should stay in bed and drink hot soup. You shouldn't go swimming today."], ["Lion Boy", "My teeth hurt!"], ["Dr. Ollie", "Do you eat a lot of candy?"], ["Lion Boy", "Yes, every day!"], ["Dr. Ollie", "You shouldn't eat so much candy, and you should brush your teeth three times a day."]], "task": null, "quiz": null}, {"id": "j17-l", "unit": 117, "kind": "Listening", "title": "Have You Ever…?", "where": "Junior A2 · Unit 17 · Listening Lab", "scene": "Ollie interviews three people about their experiences. Complete the table.", "lines": [["Ollie", "Miss Ana, have you ever been to another country?"], ["Miss Ana", "Yes, I have. I've been to Canada. I saw snow there!"], ["Ollie", "Have you ever eaten sushi?"], ["Miss Ana", "No, I've never eaten sushi."], ["Ollie", "Grandma Rosa, have you ever flown on a plane?"], ["Grandma Rosa", "Yes, many times! I've been to New York. But I've never ridden a horse."], ["Ollie", "Pedro?"], ["Pedro", "I've been to La Vega for Carnival. But I've never seen snow!"]], "task": null, "quiz": null}, {"id": "j18-l", "unit": 118, "kind": "Listening", "title": "Mission Checklist", "where": "Junior A2 · Unit 18 · Listening Lab", "scene": "Listen to Sofia and her mom before a trip. Has it been done already ✅ or not yet ⏳?", "lines": [["Mom", "Sofia, we're going to the airport at three. Have you packed your suitcase yet?"], ["Sofia", "Yes, Mom. I've already packed it."], ["Mom", "Great. Have you fed Kiko?"], ["Sofia", "Not yet! I'll do it now."], ["Mom", "And the tickets?"], ["Sofia", "Dad has just printed them. They're on the table."]], "task": null, "quiz": null}, {"id": "j19-l", "unit": 119, "kind": "Listening", "title": "Treasure Hunt", "where": "Junior A2 · Unit 19 · Listening Lab", "scene": "Listen to the directions for the zoo treasure hunt. Complete the table.", "lines": [["Ollie", "Welcome to the Zoo Treasure Hunt! Listen carefully."], ["Ollie", "Step one: go through the big gate."], ["Ollie", "Step two: walk along the flamingo lake."], ["Ollie", "Step three: go past the giraffes and up the stairs."], ["Ollie", "The treasure is next to the parrots. Good luck!"]], "task": null, "quiz": null}, {"id": "j20-l", "unit": 120, "kind": "Listening", "title": "When I Grow Up", "where": "Junior A2 · Unit 20 · Listening Lab", "scene": "Three kids talk about their dream jobs. Complete the table.", "lines": [["Ollie", "Carlos, what do you want to be?"], ["Carlos", "I want to be a chef, because I love making pancakes!"], ["Ollie", "Emily?"], ["Emily", "I'd like to be a scientist. I want to study the ocean, because I love sea turtles."], ["Ollie", "And Kevin?"], ["Kevin", "I want to be a programmer. I love computers, so I want to make video games!"]], "task": null, "quiz": null}, {"id": "j21-l", "unit": 121, "kind": "Listening", "title": "The Feelings Monster", "where": "Junior A2 · Unit 21 · Listening Lab", "scene": "Three friends tell Ollie how they feel. Complete the table.", "lines": [["Ollie", "Maya, how do you feel today?"], ["Maya", "I'm excited! We're going to the beach this weekend."], ["Ollie", "Leo, are you OK?"], ["Leo", "I'm worried. I have a guitar concert tomorrow, and it's my first one."], ["Ollie", "Sofia?"], ["Sofia", "I'm a little bored. It's raining, and I can't go outside. But my book is interesting!"]], "task": null, "quiz": null}, {"id": "j22-l", "unit": 122, "kind": "Listening", "title": "Save the Turtles!", "where": "Junior A2 · Unit 22 · Listening Lab", "scene": "A scientist gives three rules for Turtle Beach. Complete the table.", "lines": [["Scientist", "Hello, detectives! Here are three rules for Turtle Beach."], ["Scientist", "Number one: if you use a flashlight at night, the baby turtles will get confused. Use a red light instead."], ["Scientist", "Number two: if you leave plastic bags on the beach, turtles will think they're jellyfish, and they'll eat them."], ["Scientist", "Number three: if you stay away from the nests, the eggs will be safe. Thank you for helping!"]], "task": null, "quiz": null}, {"id": "j23-l", "unit": 123, "kind": "Listening", "title": "How Is Chocolate Made?", "where": "Junior A2 · Unit 23 · Listening Lab", "scene": "Listen to a tour of a juice factory. Complete the steps.", "lines": [["Guide", "Welcome to Sunny Juice Factory! First, the oranges are washed by workers."], ["Guide", "Then, they are cut by a big machine."], ["Guide", "After that, the juice is put into bottles by another machine."], ["Guide", "Finally, the bottles are checked by workers, and then they are sent to the supermarkets!"]], "task": null, "quiz": null}, {"id": "j24-l", "unit": 124, "kind": "Listening", "title": "Our Big Show", "where": "Junior A2 · Unit 24 · Listening Lab", "scene": "Listen to the show program. Complete the table.", "lines": [["Miss Ana", "Good evening, families! Welcome to the Hadash function avatar(name){
  const sp = DATA.speakers[name] || {color:'#888'};
  if (DATA.faces[name]) return `<span class="av" style="--c:${sp.color};background:#fff">${DATA.faces[name]}</span>`;
  return `<span class="av" style="--c:${sp.color};background:${sp.color}">${esc(name[0])}</span>`;
}

function vg(v){ const n = v.name + ' ' + (v.voiceURI || ''); return /female/i.test(n) ? 'f' : MAL.test(n) ? 'm' : FEM.test(n) ? 'f' : '?'; }
function pick(name){
  const sp = DATA.speakers[name] || {g:'f'}; const g = sp.g || 'f';
  const us = list => { const a = list.filter(v => /en[-_]US/i.test(v.lang)); return a.length ? a : list; };
  let pool = us(voices.filter(v => vg(v) === g)), match = true;
  if (!pool.length){ pool = us(voices.filter(v => vg(v) === '?')); match = false; }
  if (!pool.length){ pool = us(voices); match = false; }
  const same = Object.keys(DATA.speakers).filter(k => (DATA.speakers[k].g || 'f') === g);
  const v = pool.length ? pool[Math.max(0, same.indexOf(name)) % pool.length] : null;
  let pitch;
  if (match) pitch = sp.kid ? (g === 'm' ? 1.15 : 1.25) : 1.0;
  else pitch = g === 'm' ? (sp.kid ? 0.7 : 0.5) : (sp.kid ? 1.45 : 1.2);
  return {v, pitch};
}
function voiceFor(name){ return voices.length ? pick(name).v : null; }
let slow = false;
let AUD = {}, curA = null;
fetch('audio/manifest.json').then(r => r.ok ? r.json() : {}).then(m => { AUD = m || {}; }).catch(() => {});
function stopAll(){ try { speechSynthesis.cancel(); } catch(e){} if (curA){ const a = curA; curA = null; a.pause(); a.dispatchEvent(new Event('ended')); } }
function playFile(f){
  return new Promise(res => {
    const a = new Audio('audio/' + f); curA = a; a.preservesPitch = true; a.playbackRate = slow ? 0.8 : 1;
    let fin = false; const done = ok => { if (fin) return; fin = true; if (curA === a) curA = null; res(ok); };
    a.addEventListener('ended', () => done(true)); a.addEventListener('error', () => done(false));
    const pr = a.play(); if (pr && pr.catch) pr.catch(() => done(false));
  });
}
function speak(name, text){
  const f = AUD[name + '|' + text];
  if (!f) return ttsSpeak(name, text);
  return playFile(f).then(ok => ok ? undefined : ttsSpeak(name, text));
}
function ttsSpeak(name, text){
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    const sp = DATA.speakers[name] || {pitch:1, rate:1};
    const pk = voices.length ? pick(name) : {v:null, pitch: (sp.g === 'm' ? 0.6 : 1.25)};
    u.lang = 'en-US'; u.pitch = pk.pitch; u.rate = sp.rate * (slow ? 0.75 : 1);
    if (pk.v) u.voice = pk.v;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
let playing = false;
async function playAll(t){
  if (playing){ stopAll(); playing = false; setPlayBtn(false); return; }
  playing = true; setPlayBtn(true);
  for (let i = 0; i < t.lines.length && playing; i++){
    document.querySelectorAll('.ln').forEach(el => el.classList.toggle('now', +el.dataset.i === i));
    const [s, d, sp] = t.lines[i];
    await speak(s, sp || d);
    await new Promise(r => setTimeout(r, 350));
  }
  document.querySelectorAll('.ln').forEach(el => el.classList.remove('now'));
  playing = false; setPlayBtn(false);
  const plays = (store.get(t.id + ':plays') || 0) + 1; store.set(t.id + ':plays', plays);
}
function setPlayBtn(on){ const b = $('#playbtn'); if (b) b.innerHTML = on ? '⏹ Stop' : '▶ Listen'; }

/* ---------- views ---------- */
const BOOKS = {
  book1:  {emoji:'📗', name:'My English Adventure · Book 1', lv:'A1', age:'9–11 years · 9–11 años', desc:'Student’s Book and Workbook: listenings and conversations for the 24 units.', col:'#1673E6', test: n => n < 100},
  junior: {emoji:'🔎', name:'My English Adventure Junior · A2', lv:'A2', age:'8–10 years · 8–10 años', desc:'Listening Lab for the 24 Junior A2 units.', col:'#F26B00', test: n => n > 100}
};
const bookOf = t => t.unit > 100 ? 'junior' : 'book1';
function unitsOf(key){
  const byUnit = {};
  DATA.tracks.filter(t => BOOKS[key].test(t.unit)).forEach(t => (byUnit[t.unit] = byUnit[t.unit] || []).push(t));

}
function home(){

    <span class="bkmeta">${meta}</span><span class="bkgo">Enter · Entrar →</span></a>`;
  const books = card('funny-reading/', '👩‍👧‍👦', 'Phonics', '#E8566C', 'Funny Reading with Mama', '3–7 years · 3–7 años', 'Learn to read together, sound by sound: 4 phonics volumes for kids and their moms.', '4 volumes · coming soon') + Object.entries(BOOKS).map(([k, b]) => {
    const u = unitsOf(k), n = Object.values(u).reduce((s, l) => s + l.length, 0);

  return `<header class="top"><div class="wrap"><div class="brand"><span class="logo">🦉</span><div><small>MY ENGLISH ADVENTURE · HADASH ACADEMY</small><h1>English Lab</h1></div></div>
  <p style="margin:10px 0 0;opacity:.95">Choose your book, or scan the QR code in your book. 🎧💬<br><span style="opacity:.85;font-size:15px">Elige el libro que estás usando o escanea el código QR.</span></p></div></header>
  <main class="wrap"><div class="books">${books}</div>
  <p class="note noprint">Teacher: <a href="#qr">print the QR codes</a></p></main>`;
}
function bookView(key){
  const B = BOOKS[key], byUnit = unitsOf(key);
  const units = Object.keys(byUnit).map(n => {
    const items = byUnit[n].map(t => {
      const st = store.get(t.id + ':stars');
      return `<a class="ti" href="#${t.id}"><span class="ic">${icon(t.kind)}</span><span>${esc(t.title)}<em>${esc(t.where)}</em></span>${st ? '⭐'.repeat(st) : `<span class="tag ${t.kind}">${t.kind}</span>`}</a>`;
    }).join('');
    return `<div class="unit" style="--u:${ucol(+n)}"><h2><span class="un">${n > 100 ? n - 100 : n}</span>${esc(DATA.titles[n] || '')}</h2><div class="tl">${items}</div></div>`;
  }).join('');
  return `<header class="top" style="background:linear-gradient(120deg,${B.col},${B.col}cc)"><div class="wrap"><a class="back" href="#">← All books · Todos los libros</a>
  <div class="brand"><span class="logo">${B.emoji}</span><div><small>ENGLISH LAB · LEVEL ${B.lv}</small><h1>${esc(B.name)}</h1></div></div></div></header>
  <main class="wrap">${units}</main>`;
}

function trackView(t){
  const cast = [...new Set(t.lines.map(l => l[0]))];
  const lines = t.lines.map(([s, d], i) => `<div class="ln" data-i="${i}" style="--c:${(DATA.speakers[s]||{}).color||'#888'}">${avatar(s)}<p><b>${esc(s)}</b>${esc(d)}</p><button aria-label="Play this line" data-say="${i}">🔈</button></div>`).join('');
  let task = '';
  if (t.task){
    const rows = t.task.rows.map((r, ri) => `<tr><td class="given">${esc(r[0])}</td>${r.slice(1).map((v, ci) => `<td><input aria-label="${esc(t.task.cols[ci+1])} for ${esc(r[0])}" data-a="${esc(v)}" autocomplete="off"></td>`).join('')}</tr>`).join('');
    task = `<section class="sec"><h3><i>1</i>Listen and complete</h3><p>${esc(t.task.prompt)}</p>
      <table class="ttab"><thead><tr>${t.task.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
      <button class="check" id="chk">Check my answers</button><span class="score" id="tscore"></span></section>`;
  }
  let quiz = '';
  if (t.quiz){
    quiz = `<section class="sec"><h3><i>2</i>Quick quiz</h3>${t.quiz.map(([q, o, a], qi) => `<div class="q" data-q="${qi}"><p>${qi+1}. ${esc(q)}</p><div class="opts">${o.map((x, oi) => `<button class="opt" data-o="${oi}" data-ok="${oi===a}">${esc(x)}</button>`).join('')}</div></div>`).join('')}
      <p class="stars" id="qstars"></p></section>`;
  }
  const rp = `<section class="sec"><h3><i>${t.task ? 3 : 1}</i>Your turn: role-play</h3>
    <p>Choose a character. The app says the other lines. You say yours!</p>
    <div class="rpbar">${cast.map(c => `<button class="chipbtn" data-role="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="rp" id="rp"></div></section>`;
  return `<header class="top" style="background:linear-gradient(120deg,${ucol(t.unit)},${ucol(t.unit)}cc)"><div class="wrap"><a class="back" href="#${bookOf(t)}">← ${t.unit > 100 ? 'Junior A2' : 'Book 1'}</a>
    <div class="brand"><span class="logo">${icon(t.kind)}</span><div><small>${t.unit > 100 ? 'JUNIOR A2 · UNIT ' + (t.unit - 100) : 'UNIT ' + t.unit} · ${t.kind.toUpperCase()}</small><h1>${esc(DATA.titles[t.unit] || '')}</h1></div></div></div></header>
  <main class="wrap"><div class="hero"><span class="wh">${esc(t.where)}</span><h2>${esc(t.title)}</h2><div class="scene">${esc(t.scene)}</div>
    <div class="cast">${cast.map(c => `<span class="who">${avatar(c)}${esc(c)}</span>`).join('')}</div>
    <div class="player"><button class="play" id="playbtn">▶ Listen</button>
      <button class="chipbtn" id="slow" aria-pressed="false">🐢 Slow</button>
      <button class="chipbtn" id="showtxt" aria-pressed="false">📄 Show text</button></div></div>
  <section class="sec hidden-text" id="trans"><h3>💬 Conversation</h3><div class="lines">${lines}</div>
    <p class="note">Tip: listen first without the text. Then press “Show text” and listen again.</p></section>
  ${task}${quiz}${rp}</main>`;
}

function qrView(){
  const base = location.href.split('#')[0];
  const cards = DATA.tracks.map(t => `<div class="qrc"><b>${t.unit > 100 ? 'Junior · Unit ' + (t.unit - 100) : 'Unit ' + t.unit} · ${esc(t.title)}</b><div class="code" data-url="${esc(base + '#' + t.id)}"></div><small>${esc(t.where)}</small></div>`).join('');
  return `<header class="top noprint"><div class="wrap"><a class="back" href="#">← English Lab</a><div class="brand"><span class="logo">🔳</span><div><small>FOR THE TEACHER</small><h1>QR codes</h1></div></div></div></header>
  <main class="wrap"><p class="noprint">Print this page and stick each QR code in the book. Each code opens its listening page. <button class="chipbtn" onclick="print()">🖨 Print</button></p>
  <p class="note noprint">These codes use this page’s address: <b>${esc(base)}</b>. Open this page from your GitHub Pages address before printing.</p>
  <div class="qrgrid">${cards}</div></main>`;
}

function soon(id){
  const n = parseInt(id.replace(/\D/g,'').slice(0,2), 10);
  return `<header class="top" style="background:linear-gradient(120deg,${ucol(n)},${ucol(n)}cc)"><div class="wrap"><a class="back" href="#">← English Lab</a>
  <div class="brand"><span class="logo">🚧</span><div><small>UNIT ${n}</small><h1>${esc(DATA.titles[n] || '')}</h1></div></div></div></header>
  <main class="wrap"><div class="hero"><h2>Coming soon! 🦉</h2><p>This listening is not ready yet. Your teacher will read the script for you today.</p>
  <p>¡Muy pronto! Este audio todavía no está listo. Hoy tu maestra lo leerá en clase.</p><a class="play" href="#" style="text-decoration:none;display:inline-flex">🎧 Try other tracks</a></div></main>`;
}

/* ---------- behaviour ---------- */
const NUM = {zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12'};
const norm = s => { s = String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); return NUM[s] || s.replace(/ /g, s.match(/^\d/) ? '' : ' '); };

function bindTrack(t){
  $('#playbtn').onclick = () => playAll(t);
  $('#slow').onclick = e => { slow = !slow; e.currentTarget.setAttribute('aria-pressed', slow); };
  $('#showtxt').onclick = e => { const on = $('#trans').classList.toggle('hidden-text'); e.currentTarget.setAttribute('aria-pressed', !on); };
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => { stopAll(); const [s, d, sp] = t.lines[+b.dataset.say]; speak(s, sp || d); });
  const chk = $('#chk');
  if (chk) chk.onclick = () => {
    let ok = 0, all = 0;
    document.querySelectorAll('.ttab input').forEach(i => { all++; const good = norm(i.value) === norm(i.dataset.a); i.classList.toggle('ok', good); i.classList.toggle('bad', !good && i.value.trim() !== ''); if (good) ok++; });
    $('#tscore').textContent = `${ok} / ${all} ${ok === all ? '🎉' : ''}`;
    store.set(t.id + ':task', ok / all); award(t);
  };
  document.querySelectorAll('.q').forEach(q => q.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (q.dataset.done) return; q.dataset.done = 1;
    const good = b.dataset.ok === 'true'; b.classList.add(good ? 'ok' : 'bad');
    if (!good) q.querySelector('[data-ok="true"]').classList.add('ok');
    q.dataset.good = good ? 1 : 0;
    const done = [...document.querySelectorAll('.q')].filter(x => x.dataset.done);
    if (done.length === t.quiz.length){ const g = done.filter(x => x.dataset.good === '1').length; $('#qstars').textContent = '⭐'.repeat(g) + '☆'.repeat(t.quiz.length - g); store.set(t.id + ':quiz', g / t.quiz.length); award(t); }
  }));
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { document.querySelectorAll('[data-role]').forEach(x => x.setAttribute('aria-pressed', x === b)); rolePlay(t, b.dataset.role); });
}
function award(t){
  const a = store.get(t.id + ':task'), q = store.get(t.id + ':quiz');
  const parts = [a, q].filter(x => x !== null && x !== undefined);
  if (!parts.length) return;
  const avg = parts.reduce((s, x) => s + x, 0) / parts.length;
  store.set(t.id + ':stars', avg >= .9 ? 3 : avg >= .6 ? 2 : 1);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listenOnce(){
  return new Promise(res => {
    if (!SR) return res(null);
    const r = new SR(); r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = e => res(e.results[0][0].transcript); r.onerror = () => res(''); r.onend = () => res('');
    r.start();
  });
}
function similar(a, b){
  const A = norm(a).split(' '), B = new Set(norm(b).split(' '));
  if (!A.length) return 0; return A.filter(w => B.has(w)).length / Math.max(B.size, 1);
}
async function rolePlay(t, role){
  const box = $('#rp'); stopAll();
  for (let i = 0; i < t.lines.length; i++){
    const [s, d, sp] = t.lines[i];
    if (s !== role){ box.innerHTML = `<div class="ln" style="--c:${(DATA.speakers[s]||{}).color}">${avatar(s)}<p><b>${esc(s)}</b>${esc(d)}</p></div>`; await speak(s, sp || d); continue; }
    const said = await new Promise(res => {
      box.innerHTML = `<div class="say">🗣 Your line: “${esc(d)}”</div><div class="rpbar">${SR ? '<button class="mic" id="mic">🎤 Speak</button>' : ''}<button class="chipbtn" id="done">✔ I said it</button><button class="chipbtn" id="hear">🔈 Hear it</button></div><p class="fb" id="fb"></p>`;
      $('#hear').onclick = () => speak(role, sp || d);
      $('#done').onclick = () => res(true);
      if (SR) $('#mic').onclick = async () => {
        $('#fb').textContent = 'Listening… 👂'; const heard = await listenOnce();
        if (heard === null) return;
        const sc = similar(heard, d);
        $('#fb').innerHTML = sc >= .6 ? `Great job! 🎉 “${esc(heard)}”` : `Try again! I heard: “${esc(heard || '…')}”`;
        if (sc >= .6) setTimeout(() => res(true), 900);
      };
    });
  }
  box.innerHTML = `<div class="say">🎉 Well done! You finished the conversation as <b>${esc(role)}</b>. Try another character!</div>`;
}

function render(){
  stopAll(); playing = false;
  const id = location.hash.slice(1); const app = $('#app');
  const t = DATA.tracks.find(x => x.id === id);
  if (id === 'qr'){ app.innerHTML = qrView(); document.querySelectorAll('.code').forEach(el => { if (window.QRCode) new QRCode(el, {text: el.dataset.url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M}); else el.textContent = el.dataset.url; }); }
  else if (t){ app.innerHTML = trackView(t); bindTrack(t); }
  else if (BOOKS[id]) app.innerHTML = bookView(id);
  else if (/^(u|wb|j)\d\d-/.test(id)) app.innerHTML = soon(id);
  else app.innerHTML = home();
  scrollTo(0, 0);
}
addEventListener('hashchange', render); render();
</script>
